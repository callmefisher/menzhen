services:
  nginx:
    image: menzhen-nginx:latest
    build: ./nginx
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: menzhen-web:latest
    build: ./web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    image: menzhen-api:latest
    build: ./server
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    volumes:
      - ./.env:/app/.env
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backups:/backups
      - ./docker-compose.yml:/app/docker-compose.yml
      - mysql-data:/var/lib/mysql:ro
      - minio-data:/data:ro
      - /:/hostfs:ro
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: menzhen-mysql:latest
    build: ./mysql
    command: --default-authentication-plugin=mysql_native_password
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data

  backup:
    image: menzhen-backup:latest
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./backups:/backups
      - ./.env:/app/.env
      - mysql-data:/var/lib/mysql:ro
      - minio-data:/data:ro
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  minio-data:
