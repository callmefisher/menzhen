<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移动端登录预览 — 惊蛰</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #3DD68C;
    --accent-dim: #2BA86A;
    --accent-secondary: #2DD4A8;
    --accent-glow: 61, 214, 140;
    --ink: #080E1E;
    --text-primary: #E8ECF4;
    --text-secondary: #8A94A8;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--ink);
    color: var(--text-primary);
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* ====== Background ====== */
  .bg-mesh {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 10% 20%, rgba(var(--accent-glow), 0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 85% 75%, rgba(var(--accent-glow), 0.12) 0%, transparent 55%),
      radial-gradient(ellipse 50% 50% at 50% 50%, rgba(100, 80, 220, 0.08) 0%, transparent 60%),
      linear-gradient(160deg, #060C1A 0%, #0C1628 30%, #0A1225 60%, #080E1E 100%);
    animation: meshShift 12s ease-in-out infinite alternate;
  }
  @keyframes meshShift {
    0%   { filter: hue-rotate(0deg) brightness(1); }
    50%  { filter: hue-rotate(8deg) brightness(1.1); }
    100% { filter: hue-rotate(-5deg) brightness(1.05); }
  }
  .aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .aurora-band {
    position: absolute; width: 200%; height: 300px; border-radius: 50%;
    filter: blur(80px); opacity: 0;
    animation: auroraPulse 8s ease-in-out infinite; will-change: opacity, transform;
  }
  .ab1 {
    background: linear-gradient(90deg, transparent 0%, rgba(var(--accent-glow), 0.25) 30%, rgba(var(--accent-glow), 0.15) 50%, transparent 80%);
    top: -5%; left: -30%; transform: rotate(-8deg);
  }
  .ab2 {
    background: linear-gradient(90deg, transparent 10%, rgba(var(--accent-glow), 0.12) 40%, rgba(100, 80, 220, 0.1) 60%, transparent 90%);
    top: 15%; left: -20%; transform: rotate(-4deg); animation-delay: -3s; height: 200px;
  }
  @keyframes auroraPulse {
    0%, 100% { opacity: 0.3; transform: translateX(0) rotate(-8deg); }
    30%      { opacity: 0.7; }
    50%      { opacity: 0.5; transform: translateX(5%) rotate(-6deg); }
    80%      { opacity: 0.8; }
  }
  .star-field {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 25%, rgba(255,255,255,0.25), transparent),
      radial-gradient(1px 1px at 35% 60%, rgba(255,255,255,0.2), transparent),
      radial-gradient(1.5px 1.5px at 55% 15%, rgba(255,255,255,0.18), transparent),
      radial-gradient(1px 1px at 75% 45%, rgba(255,255,255,0.22), transparent),
      radial-gradient(1.5px 1.5px at 90% 80%, rgba(255,255,255,0.15), transparent),
      radial-gradient(1px 1px at 25% 85%, rgba(255,255,255,0.2), transparent);
    animation: twinkle 6s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
  .ambient-orb {
    position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
    animation: orbFloat 16s ease-in-out infinite;
  }
  .orb-1 { width: 500px; height: 500px; top: -15%; left: -15%; background: radial-gradient(circle, rgba(var(--accent-glow), 0.25) 0%, rgba(var(--accent-glow), 0.06) 40%, transparent 70%); filter: blur(50px); }
  .orb-2 { width: 350px; height: 350px; bottom: -10%; right: -10%; background: radial-gradient(circle, rgba(var(--accent-glow), 0.18) 0%, transparent 65%); filter: blur(40px); animation-delay: -8s; }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -40px) scale(1.06); }
    66% { transform: translate(-20px, 20px) scale(0.95); }
  }
  .tcm-symbol {
    position: fixed; font-family: 'Noto Serif SC', serif;
    color: var(--accent); font-weight: 900;
    user-select: none; pointer-events: none; z-index: 1; opacity: 0.05;
    text-shadow: 0 0 60px rgba(var(--accent-glow), 0.3);
  }
  .tcm-1 { top: 2%; right: 8%; font-size: 100px; animation: sym 25s ease-in-out infinite; }
  .tcm-2 { bottom: 8%; left: 5%; font-size: 80px; animation: sym 30s ease-in-out infinite reverse; }
  @keyframes sym {
    0%, 100% { transform: translate(0,0) rotate(0deg); }
    25% { transform: translate(12px,-18px) rotate(3deg); }
    50% { transform: translate(-8px,10px) rotate(-2deg); }
    75% { transform: translate(15px,5px) rotate(1deg); }
  }
  #particle-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* ====== Page layout ====== */
  .page-wrapper {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh;
    padding: 20px 16px;
  }

  /* ====== Desktop layout ====== */
  @media (min-width: 801px) {
    .page-wrapper {
      justify-content: center;
      padding: 20px;
    }
    .main-container {
      display: flex;
      width: 920px; max-width: 100%;
      border-radius: 28px;
      backdrop-filter: blur(50px) saturate(1.6); -webkit-backdrop-filter: blur(50px) saturate(1.6);
      border: 1px solid rgba(var(--accent-glow), 0.18);
      box-shadow:
        0 0 100px rgba(var(--accent-glow), 0.08),
        0 40px 80px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .brand-section {
      flex: 1; padding: 48px 40px;
      display: flex; flex-direction: column; justify-content: center;
      position: relative; overflow: hidden;
      background: linear-gradient(160deg, rgba(var(--accent-glow), 0.1) 0%, rgba(var(--accent-glow), 0.02) 40%, transparent 70%);
    }
    .brand-section::before {
      content: ''; position: absolute; right: 0; top: 8%; bottom: 8%; width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(var(--accent-glow), 0.2), transparent);
    }
    .brand-section::after {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(var(--accent-glow), 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--accent-glow), 0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none;
    }
    .brand-icon { width: 72px; height: 72px; border-radius: 20px; margin-bottom: 28px; }
    .brand-icon::after {
      content: ''; position: absolute; inset: -5px; border-radius: 25px;
      border: 1.5px solid rgba(var(--accent-glow), 0.35);
      animation: iconPulse 3s ease-in-out infinite;
    }
    .brand-label { font-size: 13px; letter-spacing: 6px; margin-bottom: 12px; }
    .brand-title { font-size: 32px; margin-bottom: 16px; }
    .brand-desc { display: block; }
    .brand-features { display: flex; margin-top: 36px; }
    .mobile-brand { display: none; }
    .form-section { width: 400px; padding: 48px 40px; }
    .form-header h2 { font-size: 24px; }
    .form-header { margin-bottom: 36px; }
  }

  /* ====== Mobile layout ====== */
  @media (max-width: 800px) {
    .page-wrapper {
      justify-content: flex-start;
      padding: 48px 16px 20px;
    }
    .main-container {
      display: flex; flex-direction: column;
      width: 100%; max-width: 420px;
      border-radius: 20px;
      backdrop-filter: blur(50px) saturate(1.6); -webkit-backdrop-filter: blur(50px) saturate(1.6);
      border: 1px solid rgba(var(--accent-glow), 0.18);
      box-shadow:
        0 0 60px rgba(var(--accent-glow), 0.06),
        0 20px 60px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    /* Desktop brand hidden on mobile */
    .brand-section { display: none; }
    /* Mobile brand header */
    .mobile-brand {
      display: flex;
      padding: 28px 22px 0;
      gap: 16px;
      align-items: center;
    }
    .mb-icon {
      width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 24px rgba(var(--accent-glow), 0.35);
      position: relative;
    }
    .mb-icon::after {
      content: ''; position: absolute; inset: -4px; border-radius: 18px;
      border: 1.5px solid rgba(var(--accent-glow), 0.3);
      animation: iconPulse 3s ease-in-out infinite;
    }
    .mb-icon svg { width: 26px; height: 26px; fill: white; }
    .mb-text { flex: 1; min-width: 0; }
    .mb-label {
      font-family: 'Noto Serif SC', serif; font-size: 10px; font-weight: 600;
      letter-spacing: 4px; color: var(--accent); margin-bottom: 4px;
      opacity: 0.8;
    }
    .mb-title {
      font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 900;
      line-height: 1.2;
      background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .mb-tagline {
      font-size: 11px; color: var(--text-secondary); margin-top: 4px;
      line-height: 1.4;
    }
    /* Mobile features strip */
    .mb-features {
      display: flex; flex-wrap: wrap; gap: 6px 12px;
      padding: 14px 22px 0;
    }
    .mb-feat {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-secondary); opacity: 0.7;
    }
    .mb-fdot {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px rgba(var(--accent-glow), 0.5);
      flex-shrink: 0;
    }
    /* Divider */
    .mb-divider {
      height: 1px; margin: 16px 22px 0;
      background: linear-gradient(90deg, transparent, rgba(var(--accent-glow), 0.15), transparent);
    }
    .form-section { width: 100%; padding: 20px 22px 28px; }
    .form-header h2 { font-size: 18px; }
    .form-header { margin-bottom: 20px; }
    .form-header p { font-size: 12px; }
    .form-group { margin-bottom: 16px; }
    .login-btn { padding: 13px; font-size: 14px; }
    .form-footer { margin-top: 18px; }
  }

  @media (max-width: 380px) {
    .page-wrapper { padding: 40px 12px 16px; }
    .mobile-brand { padding: 22px 16px 0; gap: 12px; }
    .mb-icon { width: 44px; height: 44px; border-radius: 12px; }
    .mb-icon svg { width: 22px; height: 22px; }
    .mb-title { font-size: 19px; }
    .mb-features { padding: 10px 16px 0; }
    .mb-divider { margin: 12px 16px 0; }
    .form-section { padding: 16px 16px 24px; }
    .form-header h2 { font-size: 17px; }
    .form-header { margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .login-btn { padding: 12px; }
  }

  @keyframes iconPulse { 0%, 100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.1); opacity: 0; } }

  /* ====== Shared component styles ====== */
  .brand-icon {
    border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 32px rgba(var(--accent-glow), 0.4);
    position: relative;
  }
  .brand-icon svg { width: 36px; height: 36px; fill: white; }
  .brand-title-area { position: relative; z-index: 1; }
  .brand-label {
    font-family: 'Noto Serif SC', serif; font-weight: 600;
    color: var(--accent);
  }
  .brand-title {
    font-family: 'Noto Serif SC', serif; font-weight: 900;
    line-height: 1.3;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .brand-desc { font-size: 14px; line-height: 1.8; color: var(--text-secondary); max-width: 300px; }
  .brand-features { flex-direction: column; gap: 14px; position: relative; z-index: 1; }
  .feature-item { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-secondary); }
  .feature-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-glow), 0.6); flex-shrink: 0; }

  /* Form panel */
  .form-section { display: flex; flex-direction: column; justify-content: center; }
  .form-header h2 { font-family: 'Noto Serif SC', serif; font-weight: 700; margin-bottom: 6px; color: var(--text-primary); }
  .form-header p { font-size: 13px; color: var(--text-secondary); }
  .form-group { margin-bottom: 22px; }
  .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .input-wrapper { position: relative; }
  .input-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--text-secondary);
    transition: color 0.3s; pointer-events: none; z-index: 2;
  }
  .form-input {
    width: 100%; padding: 14px 16px 14px 46px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px; color: var(--text-primary);
    font-size: 14px; font-family: inherit;
    transition: all 0.3s ease; outline: none;
  }
  .form-input::placeholder { color: rgba(138, 148, 168, 0.6); }
  .form-input:hover { border-color: rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.07); }
  .form-input:focus {
    border-color: var(--accent);
    background: rgba(var(--accent-glow), 0.06);
    box-shadow: 0 0 0 3px rgba(var(--accent-glow), 0.12), 0 0 24px rgba(var(--accent-glow), 0.08);
  }
  .form-input:focus ~ .input-icon { color: var(--accent); }

  /* Checkbox */
  .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  .checkbox-wrapper { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--text-secondary); user-select: none; }
  .checkbox-wrapper input[type="checkbox"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .custom-checkbox {
    width: 18px; height: 18px; border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 5px; display: flex; align-items: center; justify-content: center;
    transition: all 0.3s; flex-shrink: 0;
  }
  .custom-checkbox svg { width: 12px; height: 12px; opacity: 0; transform: scale(0.5); transition: all 0.2s; }
  .checkbox-wrapper input:checked + .custom-checkbox {
    background: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 10px rgba(var(--accent-glow), 0.3);
  }
  .checkbox-wrapper input:checked + .custom-checkbox svg { opacity: 1; transform: scale(1); }

  /* Button */
  .login-btn {
    width: 100%; padding: 15px; border: none; border-radius: 12px;
    font-size: 15px; font-weight: 600; font-family: inherit;
    cursor: pointer; position: relative; overflow: hidden;
    color: #0A0F1A;
    background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
    box-shadow: 0 4px 28px rgba(var(--accent-glow), 0.4);
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .login-btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
    transform: translateX(-100%); transition: transform 0.6s ease;
  }
  .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 50px rgba(var(--accent-glow), 0.5); }
  .login-btn:hover::before { transform: translateX(100%); }
  .login-btn:active { transform: translateY(0); }

  /* Password toggle */
  .password-toggle {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; padding: 4px; transition: color 0.2s;
    display: flex; align-items: center; z-index: 2;
  }
  .password-toggle:hover { color: var(--accent); }
  .password-toggle svg { width: 18px; height: 18px; }

  /* Footer */
  .form-footer { text-align: center; margin-top: 28px; font-size: 13px; color: var(--text-secondary); }
  .form-footer a { color: var(--accent); text-decoration: none; font-weight: 500; cursor: pointer; }
  .form-footer a:hover { opacity: 0.7; }

  /* Page footer */
  .page-footer { text-align: center; padding: 20px 0 16px; position: relative; z-index: 10; pointer-events: none; }
  .page-footer .version { font-size: 11px; color: rgba(138, 148, 168, 0.35); letter-spacing: 2px; margin-bottom: 4px; }
  .page-footer .copyright { font-size: 10px; color: rgba(138, 148, 168, 0.25); letter-spacing: 1px; }

  /* ====== Register form tighter spacing ====== */
  .register-form .form-group { margin-bottom: 14px; }
  .register-form .form-label { margin-bottom: 5px; }
  .register-form .form-input { padding-top: 10px; padding-bottom: 10px; }
  @media (max-width: 800px) {
    .register-form .form-group { margin-bottom: 10px; }
    .register-form .form-label { margin-bottom: 4px; font-size: 11px; }
    .register-form .form-input { padding-top: 9px; padding-bottom: 9px; font-size: 13px; }
  }
  @media (max-width: 380px) {
    .register-form .form-group { margin-bottom: 8px; }
    .register-form .form-input { padding-top: 8px; padding-bottom: 8px; padding-left: 38px; }
    .register-form .input-icon { left: 12px; width: 16px; height: 16px; }
  }

  /* Page switching */
  .form-page.hidden { display: none; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .aurora, .star-field { display: none; }
    #particle-canvas { display: none; }
  }
</style>
</head>
<body>

<div class="bg-mesh"></div>
<div class="star-field"></div>
<div class="aurora">
  <div class="aurora-band ab1"></div>
  <div class="aurora-band ab2"></div>
</div>
<div class="ambient-orb orb-1"></div>
<div class="ambient-orb orb-2"></div>
<div class="tcm-symbol tcm-1">蛰</div>
<div class="tcm-symbol tcm-2">春</div>
<canvas id="particle-canvas"></canvas>

<!-- Main -->
<div class="page-wrapper">
  <div class="main-container">
    <!-- Desktop brand panel (hidden on mobile) -->
    <div class="brand-section">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      </div>
      <div class="brand-title-area">
        <div class="brand-label">中医智慧 · 数字赋能</div>
        <h1 class="brand-title">惊蛰</h1>
        <p class="brand-desc">融汇传统医学智慧与现代数字技术，为临床诊疗提供全方位智能化支持。</p>
      </div>
      <div class="brand-features">
        <div class="feature-item"><span class="feature-dot"></span>患者病历全生命周期管理</div>
        <div class="feature-item"><span class="feature-dot"></span>中药方剂智能辅助开方</div>
        <div class="feature-item"><span class="feature-dot"></span>五运六气 · 经络穴位查询</div>
        <div class="feature-item"><span class="feature-dot"></span>多维度统计分析与报表</div>
      </div>
    </div>

    <!-- Mobile brand header (hidden on desktop) -->
    <div class="mobile-brand">
      <div class="mb-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      </div>
      <div class="mb-text">
        <div class="mb-label">中医智慧 · 数字赋能</div>
        <div class="mb-title">惊蛰</div>
        <div class="mb-tagline">传统医学与数字技术的融合</div>
      </div>
    </div>
    <div class="mb-divider"></div>

    <!-- Form panel -->
    <div class="form-section">
      <!-- LOGIN -->
      <div class="form-page" id="loginPage">
        <div class="form-header"><h2>欢迎回来</h2><p>请登录您的账户以继续</p></div>
        <form id="loginForm">
          <div class="form-group">
            <label class="form-label">用户名</label>
            <div class="input-wrapper">
              <input type="text" class="form-input" placeholder="请输入用户名" autocomplete="off" required />

<script>
(function() {
  'use strict';
  // Page switching
  var loginPage = document.getElementById('loginPage');
  var registerPage = document.getElementById('registerPage');
  document.getElementById('goRegister').addEventListener('click', function() {
    loginPage.classList.add('hidden');
    registerPage.classList.remove('hidden');
    window.scrollTo(0, 0);
  });
  document.getElementById('goLogin').addEventListener('click', function() {
    registerPage.classList.add('hidden');
    loginPage.classList.remove('hidden');
    window.scrollTo(0, 0);
  });

  // Password toggle
  var pwdField = document.getElementById('pwdField');
  document.getElementById('pwdToggle').addEventListener('click', function() {
    pwdField.type = pwdField.type === 'password' ? 'text' : 'password';
  });

  // Prevent form submit (preview only)
  document.getElementById('loginForm').addEventListener('submit', function(e) { e.preventDefault(); });
  document.getElementById('registerForm').addEventListener('submit', function(e) { e.preventDefault(); });

  // Particles
  var canvas = document.getElementById('particle-canvas');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var GLOW = '61, 214, 140';
  var COUNT = window.innerWidth <= 800 ? 40 : 80;
  var CDIST2 = 160 * 160;

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  for (var i = 0; i < COUNT; i++) {
    var o = Math.random() * 0.4 + 0.15;
    particles.push({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      s: Math.random() * 2 + 0.6,
      vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
      o: o, bo: o
    });
  }

  var raf = 0;
  function frame() {
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    var n = particles.length;
    for (var i = 0; i < n; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < -10 || p.x > w + 10 || p.y < -10 || p.y > h + 10) {
        p.x = Math.random() * w; p.y = Math.random() * h;
      }
    }
    for (var i = 0; i < n; i++) {
      var pi = particles[i];
      for (var j = i + 1; j < n; j++) {
        var pj = particles[j];
        var dx = pi.x - pj.x, dy = pi.y - pj.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < CDIST2) {
          ctx.beginPath(); ctx.moveTo(pi.x, pi.y); ctx.lineTo(pj.x, pj.y);
          ctx.strokeStyle = 'rgba(' + GLOW + ',' + ((1 - Math.sqrt(d2) / 160) * 0.15) + ')';
          ctx.lineWidth = 0.5; ctx.stroke();
        }
      }
      ctx.beginPath(); ctx.arc(pi.x, pi.y, pi.s, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(155,70%,65%,' + pi.o + ')';
      ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) raf = requestAnimationFrame(frame);
  });
})();
</script>
</body>
