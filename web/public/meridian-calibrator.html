<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经络坐标校正工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; overflow: hidden; height: 100vh; }
#app { display: flex; height: 100vh; }

/* Sidebar */
#sidebar { width: 280px; background: #16213e; display: flex; flex-direction: column; border-right: 1px solid #0f3460; overflow: hidden; }
.sidebar-section { padding: 12px; border-bottom: 1px solid #0f3460; }
.sidebar-section h3 { font-size: 13px; color: #7ec8e3; margin-bottom: 8px; }
.sidebar-scroll { flex: 1; overflow-y: auto; }

/* Meridian list */
.meridian-item { display: flex; align-items: center; padding: 6px 12px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; transition: background 0.15s; }
.meridian-item:hover { background: #1a3a5c; }
.meridian-item.active { background: #1a3a5c; border-left-color: #7ec8e3; }
.meridian-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
.meridian-id { color: #999; font-size: 11px; margin-left: auto; }
.meridian-check { color: #4caf50; margin-left: 4px; font-size: 11px; }

/* Mode toggle */
.mode-toggle { display: flex; gap: 4px; }
.mode-btn { flex: 1; padding: 6px; border: 1px solid #0f3460; background: transparent; color: #999; font-size: 12px; cursor: pointer; border-radius: 4px; transition: all 0.15s; }
.mode-btn.active { background: #0f3460; color: #7ec8e3; border-color: #7ec8e3; }

/* Point list */
.point-list { max-height: 300px; overflow-y: auto; }
.point-item { display: flex; align-items: center; padding: 4px 12px; font-size: 11px; font-family: monospace; cursor: pointer; transition: background 0.15s; }
.point-item:hover { background: #1a3a5c; }
.point-item.selected { background: #0f3460; color: #7ec8e3; }
.point-idx { width: 30px; color: #666; }
.point-coords { flex: 1; }
.point-name { color: #999; font-size: 10px; }
.point-del { color: #e74c3c; cursor: pointer; opacity: 0; padding: 0 4px; }
.point-item:hover .point-del { opacity: 1; }

/* Actions */
.actions { padding: 12px; display: flex; flex-wrap: wrap; gap: 4px; border-top: 1px solid #0f3460; }
.btn { padding: 5px 10px; border: 1px solid #0f3460; background: #16213e; color: #e0e0e0; font-size: 11px; cursor: pointer; border-radius: 3px; transition: all 0.15s; }
.btn:hover { background: #0f3460; border-color: #7ec8e3; }
.btn.primary { background: #0f3460; color: #7ec8e3; }
.btn.danger { color: #e74c3c; border-color: #e74c3c; }

/* Viewport */
#viewport { flex: 1; position: relative; }
#viewport canvas { display: block; }

/* Status bar */
#statusbar { position: absolute; bottom: 0; left: 280px; right: 0; height: 28px; background: rgba(22, 33, 62, 0.9); display: flex; align-items: center; padding: 0 12px; font-size: 11px; color: #999; border-top: 1px solid #0f3460; gap: 20px; z-index: 10; }
#statusbar .coords { color: #7ec8e3; font-family: monospace; }
#statusbar .hint { color: #666; }

/* Info overlay */
#info-overlay { position: absolute; top: 10px; right: 10px; background: rgba(22, 33, 62, 0.9); border: 1px solid #0f3460; border-radius: 6px; padding: 10px 14px; font-size: 12px; z-index: 10; max-width: 250px; }
#info-overlay h4 { color: #7ec8e3; margin-bottom: 4px; }

/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #4caf50; color: white; padding: 8px 20px; border-radius: 4px; font-size: 13px; z-index: 100; animation: fadeInOut 2s forwards; }
@keyframes fadeInOut { 0% { opacity: 0; transform: translateX(-50%) translateY(-10px); } 10% { opacity: 1; transform: translateX(-50%) translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; } }

/* Model selector */
.model-selector { display: flex; gap: 4px; margin-bottom: 8px; }
.model-btn { flex: 1; padding: 5px; border: 1px solid #0f3460; background: transparent; color: #999; font-size: 12px; cursor: pointer; border-radius: 4px; }
.model-btn.active { background: #0f3460; color: #7ec8e3; border-color: #7ec8e3; }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #16213e; }
::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sidebar-section">
      <h3>模型</h3>
      <div class="model-selector">
        <button class="model-btn active" data-model="female" onclick="switchModel('female')">女性</button>
        <button class="model-btn" data-model="male" onclick="switchModel('male')">男性</button>
      </div>
      <h3 style="margin-top:8px">模型透明度 <span id="opacity-val">100%</span></h3>
      <input type="range" id="opacity-slider" min="10" max="100" value="100" style="width:100%;accent-color:#7ec8e3;margin-bottom:8px" oninput="setModelOpacity(this.value)">
      <h3>交互模式</h3>
      <div class="mode-toggle">
        <button class="mode-btn" data-interact="drag" onclick="setInteractMode('drag')">拖拽</button>
        <button class="mode-btn active" data-interact="edit" onclick="setInteractMode('edit')">编辑</button>
      </div>
      <h3 style="margin-top:8px">编辑模式</h3>
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="path" onclick="setMode('path')">路径</button>
        <button class="mode-btn" data-mode="acupoint" onclick="setMode('acupoint')">穴位</button>
      </div>
    </div>
    <div class="sidebar-section">
      <h3>经络列表</h3>
    </div>
    <div class="sidebar-scroll" id="meridian-list"></div>
    <div class="sidebar-section">
      <h3 id="points-title">路径点</h3>
      <div class="point-list" id="point-list"></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="undoAction()" title="Ctrl+Z">撤销</button>
      <button class="btn" onclick="snapToSurface()">贴合表面</button>
      <button class="btn" onclick="autoGenPath()" style="background:#0abde3;border-color:#0abde3;color:#fff" title="根据穴位位置自动生成平滑路径">从穴位生成路径</button>
      <button class="btn danger" onclick="clearPoints()">清空</button>
      <button class="btn primary" onclick="exportCurrent()">导出当前</button>
      <button class="btn primary" onclick="exportAll()">导出全部</button>
      <button class="btn primary" onclick="syncToSource()" style="background:#2ed573;border-color:#2ed573;color:#fff">同步到源码</button>
      <button class="btn" onclick="saveToStorage()">暂存</button>
      <button class="btn" onclick="autoCalibratAll()" style="background:#e056fd;border-color:#e056fd;color:#fff;width:100%;margin-top:4px;font-weight:bold;padding:8px" title="迭代投影+双边平滑+自适应采样，一键处理全部经络">⚡ 一键全部校准</button>
      <div id="calibrate-progress" style="display:none;width:100%;margin-top:4px;">
        <div style="background:#0f3460;border-radius:3px;height:20px;overflow:hidden;position:relative">
          <div id="calibrate-bar" style="background:#e056fd;height:100%;width:0%;transition:width 0.2s"></div>
          <span id="calibrate-text" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;color:#fff"></span>
        </div>
      </div>
    </div>
  </div>
  <div id="viewport"></div>
  <div id="statusbar">
    <span id="status-mode">模式: 路径</span>
    <span id="status-coords" class="coords">--</span>
    <span id="status-hint" class="hint">点击模型表面添加路径点</span>
  </div>
</div>

    // Drag started
    gizmoDragUndoPushed = false;
  } else {
    // Drag ended — rebuild visualization
    updateVisualization();
  }
});

    const sphere = pathPoints.find(s => s.userData.index === selectedPointIndex);
    if (sphere) sphere.position.set(newCoord[0], newCoord[1], newCoord[2]);
  } else if (editMode === 'acupoint' && selectedAcupointCode) {
    workingAcupoints[selectedAcupointCode] = newCoord;
    const marker = acupointMarkers.find(m => m.userData.code === selectedAcupointCode);
    if (marker) marker.position.set(newCoord[0], newCoord[1], newCoord[2]);
  }

  document.getElementById('status-coords').textContent =
    `X: ${pos.x.toFixed(3)}  Y: ${pos.y.toFixed(3)}  Z: ${pos.z.toFixed(3)}`;
});

function showGizmo(x, y, z) {
  gizmoTarget.position.set(x, y, z);
  transformControls.attach(gizmoTarget);
  transformControls.showX = true;
  transformControls.showY = true;
  transformControls.showZ = true;
  gizmoHelper.visible = true;
  transformControls.enabled = true;
}

function hideGizmo() {
  transformControls.detach();
  gizmoHelper.visible = false;
  transformControls.enabled = false;
}

dir1.position.set(5, 5, 5);

// ==================== MODEL ====================
let modelGroup = null;
let modelMeshes = [];
let mergedBVH = null; // { geometry, bvh }
const loader = new GLTFLoader();

function loadModel(modelType) {
  if (modelGroup) {
    scene.remove(modelGroup);
    modelGroup = null;
    modelMeshes = [];
    if (mergedBVH) {
      mergedBVH.geometry.dispose();
      mergedBVH = null;
    }
  }
  const config = MODEL_CONFIGS[modelType];
  loader.load(config.url, (gltf) => {
    modelGroup = new THREE.Group();
    const s = config.scale;
    const inner = new THREE.Group();
    inner.scale.set(s, s, s);
    inner.position.set(0, config.offsetY * s, 0);
    inner.add(gltf.scene);
    modelGroup.add(inner);
    scene.add(modelGroup);

    // Collect meshes for raycasting
    modelMeshes = [];
    modelGroup.traverse((child) => {
      if (child.isMesh) {
        // Setup material for transparency support
        if (child.material) {
          const mat = child.material.clone();
          const slider = document.getElementById('opacity-slider');
          const opVal = slider ? parseInt(slider.value) / 100 : 1.0;
          mat.transparent = opVal < 1.0;
          mat.opacity = opVal;
          mat.depthWrite = opVal >= 1.0;
          mat.side = THREE.DoubleSide;
          child.material = mat;
        }
        modelMeshes.push(child);
      }
    });

    // Build merged BVH for surface projection
    buildMergedBVH();

    showToast(`${modelType === 'female' ? '女性' : '男性'}模型加载完成`);
    updateVisualization();
  }, undefined, (err) => {
    showToast('模型加载失败: ' + err.message);
  });
}

// ==================== VISUALIZATION ====================
let pathLine = null;
let pathPoints = [];
let acupointMarkers = [];
const vizGroup = new THREE.Group();
scene.add(vizGroup);

function clearVisualization() {
  while (vizGroup.children.length > 0) {
    const child = vizGroup.children[0];
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
    vizGroup.remove(child);
  }
  pathPoints = [];
  acupointMarkers = [];
  pathLine = null;
}

function updateVisualization() {
  clearVisualization();
  const mid = currentMeridianId;
  const meta = MERIDIAN_META.find(m => m.id === mid);
  if (!meta) return;
  const color = new THREE.Color(meta.color);

  if (editMode === 'path') {
    // Draw path as tube for visible thickness
    const pathData = workingPaths[mid]?.path || [];
    // Filter out NaN points for tube rendering
    const validPathData = pathData.filter(p => p && isFinite(p[0]) && isFinite(p[1]) && isFinite(p[2]));
    if (validPathData.length > 1) {
      const pts = validPathData.map(p => new THREE.Vector3(p[0], p[1], p[2]));
      const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.3);
      const segments = Math.max(20, pts.length * 8);
      const tubeGeo = new THREE.TubeGeometry(curve, segments, 0.002, 6, false);
      const tubeMat = new THREE.MeshBasicMaterial({ color });
      pathLine = new THREE.Mesh(tubeGeo, tubeMat);
      vizGroup.add(pathLine);

      // Meridian name label at path midpoint
      const midPt = validPathData[Math.floor(validPathData.length / 2)];
      if (midPt) {
        const nameLabel = createTextSprite(meta.name, meta.color, 40, 'rgba(0,0,0,0.7)');
        nameLabel.position.set(midPt[0], midPt[1] + 0.03, midPt[2]);
        vizGroup.add(nameLabel);
      }
    }

    // Control point spheres (small)
    pathData.forEach((p, i) => {
      if (!p || !isFinite(p[0]) || !isFinite(p[1]) || !isFinite(p[2])) return;
      const isSelected = i === selectedPointIndex;
      const geo = new THREE.SphereGeometry(isSelected ? 0.007 : 0.005, 10, 10);
      const mat = new THREE.MeshBasicMaterial({
        color: isSelected ? 0xffffff : color,
        depthTest: false,
      });
      const sphere = new THREE.Mesh(geo, mat);
      sphere.position.set(p[0], p[1], p[2]);
      sphere.userData = { type: 'pathPoint', index: i };
      vizGroup.add(sphere);
      pathPoints.push(sphere);
    });
  } else {
    // Acupoint mode: show path as thin tube + acupoint markers
    const pathData = workingPaths[mid]?.path || [];
    const validPathData = pathData.filter(p => p && isFinite(p[0]) && isFinite(p[1]) && isFinite(p[2]));
    if (validPathData.length > 1) {
      const pts = validPathData.map(p => new THREE.Vector3(p[0], p[1], p[2]));
      const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.3);
      const segments = Math.max(20, pts.length * 8);
      const tubeGeo = new THREE.TubeGeometry(curve, segments, 0.001, 6, false);
      const tubeMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.4 });
      vizGroup.add(new THREE.Mesh(tubeGeo, tubeMat));

      // Meridian name label at path midpoint (acupoint mode)
      const midPt = validPathData[Math.floor(validPathData.length / 2)];
      if (midPt) {
        const nameLabel = createTextSprite(meta.name, meta.color, 40, 'rgba(0,0,0,0.5)');
        nameLabel.position.set(midPt[0], midPt[1] + 0.03, midPt[2]);
        vizGroup.add(nameLabel);
      }
    }

    // Acupoint markers (larger, always visible) + labels
    const codes = ACUPOINT_CODES[mid] || [];
    codes.forEach((code) => {
      const pos = workingAcupoints[code];
      if (!pos || !isValidVec3(pos)) return;
      const isSelected = code === selectedAcupointCode;
      const geo = new THREE.SphereGeometry(isSelected ? 0.008 : 0.006, 10, 10);
      const mat = new THREE.MeshBasicMaterial({
        color: isSelected ? 0xffffff : color,
        depthTest: false,
      });
      const sphere = new THREE.Mesh(geo, mat);
      sphere.position.set(pos[0], pos[1], pos[2]);
      sphere.renderOrder = 999;
      sphere.userData = { type: 'acupoint', code };
      vizGroup.add(sphere);
      acupointMarkers.push(sphere);

      // Text label above acupoint
      const name = ACUPOINT_NAMES[code] || code;
      const label = createTextSprite(`${code} ${name}`, isSelected ? '#ffffff' : meta.color, 36);
      label.position.set(pos[0], pos[1] + 0.02, pos[2]);
      vizGroup.add(label);
    });
  }

  // Show/hide gizmo based on selection
  if (editMode === 'path' && selectedPointIndex >= 0) {
    const p = workingPaths[mid]?.path?.[selectedPointIndex];
    if (p) showGizmo(p[0], p[1], p[2]);
    else hideGizmo();
  } else if (editMode === 'acupoint' && selectedAcupointCode) {
    const p = workingAcupoints[selectedAcupointCode];
    if (p) showGizmo(p[0], p[1], p[2]);
    else hideGizmo();
  } else {
    hideGizmo();
  }

  renderPointList();
}

// ==================== INTERACTION ====================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let mouseDownPos = { x: 0, y: 0 };
let isDragging = false;

function getMouseNDC(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  return {
    x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
    y: -((e.clientY - rect.top) / rect.height) * 2 + 1,
  };
}

renderer.domElement.addEventListener('mousedown', (e) => {
  mouseDownPos = { x: e.clientX, y: e.clientY };
  isDragging = false;
  isDraggingAcupoint = false;
  acuDragUndoPushed = false;
  isDraggingPathPoint = false;
  pathDragUndoPushed = false;

  if (e.button !== 0 || interactMode === 'drag') return;

  const ndc = getMouseNDC(e);
  mouse.set(ndc.x, ndc.y);
  raycaster.setFromCamera(mouse, camera);

  if (editMode === 'path') {
    // Path point: click any point to start drag
    if (pathPoints.length > 0) {
      const pointHits = raycaster.intersectObjects(pathPoints, false);
      if (pointHits.length > 0) {
        pathDragIndex = pointHits[0].object.userData.index;
        selectedPointIndex = pathDragIndex;
        isDraggingPathPoint = true;
        controls.enabled = false;
        updateVisualization();
        return;
      }
    }
  } else {
    // Acupoint: click any acupoint to start drag (no need to pre-select)
    if (acupointMarkers.length > 0) {
      const acuHits = raycaster.intersectObjects(acupointMarkers, false);
      if (acuHits.length > 0) {
        selectedAcupointCode = acuHits[0].object.userData.code;
        isDraggingAcupoint = true;
        controls.enabled = false;
        updateVisualization();
        return;
      }
    }
  }
});

renderer.domElement.addEventListener('mousemove', (e) => {
  const dx = e.clientX - mouseDownPos.x;
  const dy = e.clientY - mouseDownPos.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;

  // In drag mode, hide cursor marker
  if (interactMode === 'drag') {
    cursorMarker.visible = false;
    return;
  }

  // Update cursor
  const ndc = getMouseNDC(e);
  mouse.set(ndc.x, ndc.y);
  raycaster.setFromCamera(mouse, camera);

  // Dragging an acupoint: move it to mouse position on model surface
  if (isDraggingAcupoint && selectedAcupointCode && isDragging) {
    const modelHits = raycaster.intersectObjects(modelMeshes, true);
    if (modelHits.length > 0) {
      if (!acuDragUndoPushed) {
        pushUndo();
        acuDragUndoPushed = true;
      }
      const p = modelHits[0].point;
      const newCoord = [round3(p.x), round3(p.y), round3(p.z)];
      // Update acupoint position
      workingAcupoints[selectedAcupointCode] = newCoord;
      // Update nearest path point
      const mid = currentMeridianId;
      const pathArr = workingPaths[mid]?.path;
      if (pathArr) {
        let bestIdx = -1, bestDist = Infinity;
        for (let i = 0; i < pathArr.length; i++) {
          const pp = pathArr[i];
          const d = Math.hypot(pp[0]-newCoord[0], pp[1]-newCoord[1], pp[2]-newCoord[2]);
          if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
        if (bestIdx >= 0 && bestDist < 0.03) {
          pathArr[bestIdx] = [...newCoord];
        }
      }
      // Update sphere position directly for smooth visual (skip full rebuild)
      const marker = acupointMarkers.find(m => m.userData.code === selectedAcupointCode);
      if (marker) marker.position.set(newCoord[0], newCoord[1], newCoord[2]);
      cursorMarker.position.copy(modelHits[0].point);
      cursorMarker.visible = true;
      document.getElementById('status-coords').textContent =
        `X: ${p.x.toFixed(3)}  Y: ${p.y.toFixed(3)}  Z: ${p.z.toFixed(3)}`;
    }
    return;
  }

  // Dragging a path point: move it to mouse position on model surface
  if (isDraggingPathPoint && pathDragIndex >= 0 && isDragging) {
    const modelHits = raycaster.intersectObjects(modelMeshes, true);
    if (modelHits.length > 0) {
      if (!pathDragUndoPushed) {
        pushUndo();
        pathDragUndoPushed = true;
      }
      const p = modelHits[0].point;
      const newCoord = mergedBVH
        ? projectPointToSurface([p.x, p.y, p.z])
        : [round3(p.x), round3(p.y), round3(p.z)];
      const mid = currentMeridianId;
      if (workingPaths[mid]?.path && workingPaths[mid].path[pathDragIndex]) {
        workingPaths[mid].path[pathDragIndex] = newCoord;
      }
      // Update sphere position directly for smooth drag
      const sphere = pathPoints.find(s => s.userData.index === pathDragIndex);
      if (sphere) sphere.position.set(newCoord[0], newCoord[1], newCoord[2]);
      cursorMarker.position.copy(modelHits[0].point);
      cursorMarker.visible = true;
      document.getElementById('status-coords').textContent =
        `X: ${newCoord[0].toFixed(3)}  Y: ${newCoord[1].toFixed(3)}  Z: ${newCoord[2].toFixed(3)}`;
    }
    return;
  }

  // Hover cursor feedback
  if (editMode === 'path' && pathPoints.length > 0) {
    const pointHits = raycaster.intersectObjects(pathPoints, false);
    renderer.domElement.style.cursor = pointHits.length > 0 ? 'grab' : 'crosshair';
  } else if (editMode === 'acupoint' && acupointMarkers.length > 0) {
    const acuHits = raycaster.intersectObjects(acupointMarkers, false);
    renderer.domElement.style.cursor = acuHits.length > 0 ? 'grab' : 'crosshair';
  }

  const hits = raycaster.intersectObjects(modelMeshes, true);
  if (hits.length > 0) {
    const p = hits[0].point;
    cursorMarker.position.copy(p);
    cursorMarker.visible = true;
    document.getElementById('status-coords').textContent =
      `X: ${p.x.toFixed(3)}  Y: ${p.y.toFixed(3)}  Z: ${p.z.toFixed(3)}`;
  } else {
    cursorMarker.visible = false;
    document.getElementById('status-coords').textContent = '--';
  }
});

renderer.domElement.addEventListener('mouseup', (e) => {
  // End acupoint drag
  if (isDraggingAcupoint) {
    isDraggingAcupoint = false;
    controls.enabled = true;
    if (acuDragUndoPushed) {
      updateVisualization();
    } else {
      // Click (no drag): keep selection, update hint
      updateVisualization();
      updateStatusHint();
    }
    return;
  }
  // End path point drag
  if (isDraggingPathPoint) {
    isDraggingPathPoint = false;
    controls.enabled = true;
    if (pathDragUndoPushed) {
      updateVisualization();
    } else {
      // Click (no drag): toggle selection
      updateVisualization();
      updateStatusHint();
    }
    return;
  }
  if (isDragging) return;
  if (interactMode === 'drag') return; // Drag mode: no editing
  if (e.button === 2) {
    // Right-click: delete selected point
    handleRightClick(e);
    return;
  }
  if (e.button !== 0) return;
  handleClick(e);
});

renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

function handleClick(e) {
  const ndc = getMouseNDC(e);
  mouse.set(ndc.x, ndc.y);
  raycaster.setFromCamera(mouse, camera);

  if (editMode === 'path') {
    // Check if clicked on existing path point
    const pointHits = raycaster.intersectObjects(pathPoints, false);
    if (pointHits.length > 0) {
      const idx = pointHits[0].object.userData.index;
      selectedPointIndex = (selectedPointIndex === idx) ? -1 : idx;
      updateVisualization();
      return;
    }

    // Click on model surface
    const modelHits = raycaster.intersectObjects(modelMeshes, true);
    if (modelHits.length > 0) {
      const p = modelHits[0].point;
      const coord = [round3(p.x), round3(p.y), round3(p.z)];
      const mid = currentMeridianId;

      if (!workingPaths[mid]) workingPaths[mid] = { path: [] };

      if (selectedPointIndex >= 0 && e.shiftKey) {
        // Shift+click: insert after selected
        pushUndo();
        workingPaths[mid].path.splice(selectedPointIndex + 1, 0, coord);
        selectedPointIndex = selectedPointIndex + 1;
      } else if (selectedPointIndex >= 0) {
        // Move selected point
        pushUndo();
        workingPaths[mid].path[selectedPointIndex] = coord;
      } else {
        // Add at end
        pushUndo();
        workingPaths[mid].path.push(coord);
        selectedPointIndex = workingPaths[mid].path.length - 1;
      }
      updateVisualization();
    }
  } else {
    // Acupoint mode
    // Check if clicked on existing acupoint
    const acuHits = raycaster.intersectObjects(acupointMarkers, false);
    if (acuHits.length > 0) {
      const code = acuHits[0].object.userData.code;
      selectedAcupointCode = (selectedAcupointCode === code) ? null : code;
      updateVisualization();
      return;
    }

    // Click on model surface
    if (selectedAcupointCode) {
      const modelHits = raycaster.intersectObjects(modelMeshes, true);
      if (modelHits.length > 0) {
        const p = modelHits[0].point;
        pushUndo();
        const newCoord = [round3(p.x), round3(p.y), round3(p.z)];
        // Also update the nearest path point so the line follows
        const oldPos = workingAcupoints[selectedAcupointCode];
        const pathArr = workingPaths[mid]?.path;
        if (oldPos && pathArr) {
          let bestIdx = -1, bestDist = Infinity;
          for (let i = 0; i < pathArr.length; i++) {
            const pp = pathArr[i];
            const d = Math.hypot(pp[0]-oldPos[0], pp[1]-oldPos[1], pp[2]-oldPos[2]);
            if (d < bestDist) { bestDist = d; bestIdx = i; }
          }
          if (bestIdx >= 0 && bestDist < 0.02) {
            pathArr[bestIdx] = [...newCoord];
          }
        }
        workingAcupoints[selectedAcupointCode] = newCoord;
        updateVisualization();
      }
    }
  }
}

function handleRightClick(e) {
  if (editMode === 'path' && selectedPointIndex >= 0) {
    const mid = currentMeridianId;
    if (workingPaths[mid]?.path) {
      pushUndo();
      workingPaths[mid].path.splice(selectedPointIndex, 1);
      selectedPointIndex = -1;
      updateVisualization();
    }
  }
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    selectedPointIndex = -1;
    selectedAcupointCode = null;
    updateVisualization();
  }
  if (e.ctrlKey && e.key === 'z') {
    undoAction();
    e.preventDefault();
  }
  // X/Y/Z keys toggle axis constraints on gizmo (skip if Ctrl held)
  if (!e.ctrlKey && !e.metaKey && transformControls.visible && (e.key === 'x' || e.key === 'X')) {
    transformControls.showX = !transformControls.showX;
    e.preventDefault();
  }
  if (!e.ctrlKey && !e.metaKey && transformControls.visible && (e.key === 'y' || e.key === 'Y')) {
    transformControls.showY = !transformControls.showY;
    e.preventDefault();
  }
  if (!e.ctrlKey && !e.metaKey && transformControls.visible && (e.key === 'z' || e.key === 'Z')) {
    transformControls.showZ = !transformControls.showZ;
    e.preventDefault();
  }
  // Arrow keys to navigate points
  if (editMode === 'path' && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    const pts = workingPaths[currentMeridianId]?.path || [];
    if (pts.length === 0) return;
    if (e.key === 'ArrowUp') {
      selectedPointIndex = Math.max(0, selectedPointIndex - 1);
    } else {
      selectedPointIndex = Math.min(pts.length - 1, selectedPointIndex + 1);
    }
    updateVisualization();
    e.preventDefault();
  }
});

// ==================== SURFACE PROJECTION (BVH) ====================
function buildMergedBVH() {
  if (modelMeshes.length === 0) return;
  showToast('正在构建 BVH...');

  // Merge all mesh geometries into world space
  let totalVerts = 0, totalIdx = 0;
  const geoInfos = [];

  for (const mesh of modelMeshes) {
    mesh.updateMatrixWorld(true);
    const geo = mesh.geometry;
    if (!geo || !geo.attributes.position) continue;
    const posAttr = geo.attributes.position;
    const idxAttr = geo.index;
    const vertCount = posAttr.count;
    const faceCount = idxAttr ? idxAttr.count : vertCount;
    geoInfos.push({ mesh, geo, posAttr, idxAttr, vertCount, faceCount, vertOffset: totalVerts });
    totalVerts += vertCount;
    totalIdx += faceCount;
  }

  const mergedPos = new Float32Array(totalVerts * 3);
  const mergedIdx = new Uint32Array(totalIdx);
  let posOff = 0, idxOff = 0;

  const tmpVec = new THREE.Vector3();
  for (const info of geoInfos) {
    // Transform positions to world space
    for (let i = 0; i < info.vertCount; i++) {
      tmpVec.set(
        info.posAttr.getX(i),
        info.posAttr.getY(i),
        info.posAttr.getZ(i)
      );
      tmpVec.applyMatrix4(info.mesh.matrixWorld);
      mergedPos[(posOff + i) * 3] = tmpVec.x;
      mergedPos[(posOff + i) * 3 + 1] = tmpVec.y;
      mergedPos[(posOff + i) * 3 + 2] = tmpVec.z;
    }
    // Copy indices with offset
    if (info.idxAttr) {
      for (let i = 0; i < info.faceCount; i++) {
        mergedIdx[idxOff + i] = info.idxAttr.getX(i) + posOff;
      }
    } else {
      for (let i = 0; i < info.faceCount; i++) {
        mergedIdx[idxOff + i] = posOff + i;
      }
    }
    posOff += info.vertCount;
    idxOff += info.faceCount;
  }

  const mergedGeo = new THREE.BufferGeometry();
  mergedGeo.setAttribute('position', new THREE.BufferAttribute(mergedPos, 3));
  mergedGeo.setIndex(new THREE.BufferAttribute(mergedIdx, 1));
  mergedGeo.computeVertexNormals();

  const bvh = new MeshBVH(mergedGeo);
  mergedBVH = { geometry: mergedGeo, bvh };
  showToast(`BVH 构建完成 (${totalVerts} 顶点)`);
}

function projectPointToSurface(point, offset = 0.006) {
  if (!mergedBVH) return point;
  if (!isValidVec3(point)) return point;
  const p = new THREE.Vector3(point[0], point[1], point[2]);
  const target = { point: new THREE.Vector3(), distance: Infinity, faceIndex: 0 };
  mergedBVH.bvh.closestPointToPoint(p, target);

  if (target.distance < Infinity) {
    // Get face normal
    const faceIdx = target.faceIndex;
    const idxAttr = mergedBVH.geometry.index;
    const posAttr = mergedBVH.geometry.attributes.position;
    if (!idxAttr || !posAttr) return point;
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    const ia = idxAttr.getX(faceIdx * 3);
    const ib = idxAttr.getX(faceIdx * 3 + 1);
    const ic = idxAttr.getX(faceIdx * 3 + 2);
    a.fromBufferAttribute(posAttr, ia);
    b.fromBufferAttribute(posAttr, ib);
    c.fromBufferAttribute(posAttr, ic);
    const normal = new THREE.Vector3();
    const edge1 = b.clone().sub(a);
    const edge2 = c.clone().sub(a);
    normal.crossVectors(edge1, edge2).normalize();

    if (normal.lengthSq() < 0.0001) normal.set(0, 1, 0);

    const projected = target.point.clone().add(normal.multiplyScalar(offset));
    const result = [round3(projected.x), round3(projected.y), round3(projected.z)];
    if (!isValidVec3(result)) return point;
    return result;
  }
  return point;
}

function snapToSurface() {
  if (modelMeshes.length === 0) { showToast('模型未加载'); return; }
  pushUndo();
  const mid = currentMeridianId;

  if (editMode === 'path') {
    const pts = workingPaths[mid]?.path || [];
    if (pts.length === 0) { showToast('无路径点'); return; }
    showToast(`正在投影 ${pts.length} 个路径点...`);
    for (let i = 0; i < pts.length; i++) {
      pts[i] = projectPointToSurface(pts[i]);
    }
    workingPaths[mid].path = pts;
  } else {
    const codes = ACUPOINT_CODES[mid] || [];
    const validCodes = codes.filter(c => workingAcupoints[c]);
    if (validCodes.length === 0) { showToast('无穴位数据'); return; }
    showToast(`正在投影 ${validCodes.length} 个穴位...`);
    for (const code of validCodes) {
      workingAcupoints[code] = projectPointToSurface(workingAcupoints[code]);
    }
  }

  updateVisualization();
  showToast('贴合表面完成');
}

function generatePathFromAcupoints(density = 4) {
  const mid = currentMeridianId;
  const codes = ACUPOINT_CODES[mid] || [];

  // Get positioned acupoints in order
  const positions = [];
  for (const code of codes) {
    const pos = workingAcupoints[code];
    if (pos) positions.push(new THREE.Vector3(pos[0], pos[1], pos[2]));
  }

  if (positions.length < 2) {
    showToast('至少需要2个已定位穴位才能生成路径');
    return;
  }

  pushUndo();

  // Create smooth Catmull-Rom curve through acupoints
  const curve = new THREE.CatmullRomCurve3(positions, false, 'centripetal', 0.5);

  // Sample: density points between each pair of acupoints
  const numPoints = Math.max(20, (positions.length - 1) * density + 1);
  const sampled = curve.getPoints(numPoints - 1);

  // Convert to arrays and project to model surface
  const newPath = sampled.map(p => {
    const coord = [round3(p.x), round3(p.y), round3(p.z)];
    return mergedBVH ? projectPointToSurface(coord) : coord;
  });

  if (!workingPaths[mid]) workingPaths[mid] = {};
  workingPaths[mid].path = newPath;

  // Switch to path mode to see the result
  editMode = 'path';
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === 'path');
  });

  updateVisualization();
  updateStatusHint();
  showToast(`从 ${positions.length} 个穴位生成了 ${newPath.length} 点路径`);
}

// ==================== AUTO-CALIBRATE ALGORITHM ====================
// Iterative surface fitting with guided projection + bilateral smoothing

let bodyCenterAxis = null; // cached center axis per model

/**
 * Build body center axis from mesh geometry (82 Y-slices).
 * For trunk: average of all verts near center; for legs: split left/right.
 */
function buildBodyCenterAxis() {
  if (!mergedBVH) return;
  const posAttr = mergedBVH.geometry.attributes.position;
  const count = posAttr.count;

  // Collect vertices into Y-slices (step 0.02, 82 slices from 0 to 1.64)
  const sliceStep = 0.02;
  const numSlices = Math.ceil(1.64 / sliceStep) + 1;
  const slices = Array.from({ length: numSlices }, () => ({ sumX: 0, sumZ: 0, count: 0 }));
  const slicesTrunk = Array.from({ length: numSlices }, () => ({ sumX: 0, sumZ: 0, count: 0 }));
  const slicesLegL = Array.from({ length: numSlices }, () => ({ sumX: 0, sumZ: 0, count: 0 }));
  const slicesLegR = Array.from({ length: numSlices }, () => ({ sumX: 0, sumZ: 0, count: 0 }));

  for (let i = 0; i < count; i++) {
    const x = posAttr.getX(i);
    const y = posAttr.getY(i);
    const z = posAttr.getZ(i);
    const si = Math.min(numSlices - 1, Math.max(0, Math.round(y / sliceStep)));

    slices[si].sumX += x; slices[si].sumZ += z; slices[si].count++;

    if (Math.abs(x) < 0.15) {
      slicesTrunk[si].sumX += x; slicesTrunk[si].sumZ += z; slicesTrunk[si].count++;
    }
    if (y < 0.82) {
      if (x < 0) { slicesLegL[si].sumX += x; slicesLegL[si].sumZ += z; slicesLegL[si].count++; }
      else { slicesLegR[si].sumX += x; slicesLegR[si].sumZ += z; slicesLegR[si].count++; }
    }
  }

  const getCenter = (s) => s.count > 0 ? { x: s.sumX / s.count, z: s.sumZ / s.count } : { x: 0, z: 0 };

  bodyCenterAxis = {
    all: slices.map(getCenter),
    trunk: slicesTrunk.map(getCenter),
    legL: slicesLegL.map(getCenter),
    legR: slicesLegR.map(getCenter),
    step: sliceStep,
  };
}

/**
 * Get body center point for a given 3D position and meridian.
 */
const ARM_MERIDIANS = new Set(['LU','LI','HT','SI','PC','TE']);

function getBodyCenter(point, meridianId) {
  if (!bodyCenterAxis) return new THREE.Vector3(0, point[1], 0);
  const si = Math.min(bodyCenterAxis.all.length - 1, Math.max(0, Math.round(point[1] / bodyCenterAxis.step)));

  // Arm meridians: use arm cross-section center (when far from trunk)
  if (ARM_MERIDIANS.has(meridianId) && Math.abs(point[0]) > 0.15) {
    // Arm center is roughly at same X, center of Y/Z cross-section
    const s = bodyCenterAxis.all[si];
    return new THREE.Vector3(point[0], point[1], s.z);
  }

  // Leg region
  if (point[1] < 0.82) {
    const s = point[0] < 0 ? bodyCenterAxis.legL[si] : bodyCenterAxis.legR[si];
    return new THREE.Vector3(s.x, point[1], s.z);
  }

  // Trunk/head
  const s = bodyCenterAxis.trunk[si].x !== undefined ? bodyCenterAxis.trunk[si] : bodyCenterAxis.all[si];
  return new THREE.Vector3(s.x, point[1], s.z);
}

/**
 * Compute barycentric-interpolated smooth normal at a surface point.
 */
function getSmoothNormal(faceIndex, surfacePoint) {
  const geo = mergedBVH.geometry;
  const normalAttr = geo.attributes.normal;
  const idxAttr = geo.index;
  const posAttr = geo.attributes.position;

  if (!idxAttr || !posAttr) {
    // No index buffer — cannot compute normal from geometry
    return new THREE.Vector3(0, 1, 0);
  }

  if (!normalAttr) {
    // Fallback to face normal (no vertex normals available)
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    const ia = idxAttr.getX(faceIndex * 3);
    const ib = idxAttr.getX(faceIndex * 3 + 1);
    const ic = idxAttr.getX(faceIndex * 3 + 2);
    a.fromBufferAttribute(posAttr, ia);
    b.fromBufferAttribute(posAttr, ib);
    c.fromBufferAttribute(posAttr, ic);
    const n = new THREE.Vector3();
    n.crossVectors(b.clone().sub(a), c.clone().sub(a)).normalize();
    return n;
  }

  const ia = idxAttr.getX(faceIndex * 3);
  const ib = idxAttr.getX(faceIndex * 3 + 1);
  const ic = idxAttr.getX(faceIndex * 3 + 2);

  const a = new THREE.Vector3().fromBufferAttribute(posAttr, ia);
  const b = new THREE.Vector3().fromBufferAttribute(posAttr, ib);
  const c = new THREE.Vector3().fromBufferAttribute(posAttr, ic);

  // Barycentric coordinates
  const v0 = b.clone().sub(a);
  const v1 = c.clone().sub(a);
  const v2 = surfacePoint.clone().sub(a);
  const d00 = v0.dot(v0);
  const d01 = v0.dot(v1);
  const d11 = v1.dot(v1);
  const d20 = v2.dot(v0);
  const d21 = v2.dot(v1);
  const denom = d00 * d11 - d01 * d01;
  const bv = denom !== 0 ? (d11 * d20 - d01 * d21) / denom : 1/3;
  const bw = denom !== 0 ? (d00 * d21 - d01 * d20) / denom : 1/3;
  const bu = 1 - bv - bw;

  const na = new THREE.Vector3().fromBufferAttribute(normalAttr, ia);
  const nb = new THREE.Vector3().fromBufferAttribute(normalAttr, ib);
  const nc = new THREE.Vector3().fromBufferAttribute(normalAttr, ic);

  return na.multiplyScalar(bu).add(nb.multiplyScalar(bv)).add(nc.multiplyScalar(bw)).normalize();
}

/**
 * Project a point to nearest surface using BVH closestPointToPoint + smooth normal offset.
 * Uses body center axis to ensure normal points outward (side guard).
 */
function projectToSurfaceSmooth(point, meridianId, offset = 0.006) {
  if (!mergedBVH) return point;
  if (!point || point.length < 3 || !isFinite(point[0]) || !isFinite(point[1]) || !isFinite(point[2])) return point;

  const p = new THREE.Vector3(point[0], point[1], point[2]);
  const target = { point: new THREE.Vector3(), distance: Infinity, faceIndex: 0 };
  mergedBVH.bvh.closestPointToPoint(p, target);

  if (target.distance >= Infinity) return point;

  const normal = getSmoothNormal(target.faceIndex, target.point);

  // Side guard: ensure normal points outward from body center
  if (meridianId && bodyCenterAxis) {
    const center = getBodyCenter(point, meridianId);
    const outward = new THREE.Vector3().subVectors(target.point, center);
    if (outward.lengthSq() > 0.0001 && normal.dot(outward) < 0) {
      normal.negate();
    }
  }

  if (normal.lengthSq() < 0.01) {
    // Fallback: use direction from query point to surface
    normal.subVectors(p, target.point).normalize();
    if (normal.lengthSq() < 0.01) normal.set(0, 1, 0);
  }

  const projected = target.point.clone().add(normal.multiplyScalar(offset));
  const result = [round3(projected.x), round3(projected.y), round3(projected.z)];

  // NaN safety: return original point if projection fails
  if (!isFinite(result[0]) || !isFinite(result[1]) || !isFinite(result[2])) return point;
  return result;
}

/**
 * Bilateral smoothing: preserves sharp transitions at joints while smoothing noise.
 * Pinned points (acupoints) are never moved.
 */
function bilateralSmooth(points, pinnedSet, sigma_s = 3, sigma_r = 0.01) {
  if (!points || points.length === 0) return points;
  const result = points.map(p => [...p]);
  const sigma_s2 = 2 * sigma_s * sigma_s;
  const sigma_r2 = 2 * sigma_r * sigma_r;
  const halfWin = 5;

  for (let i = 0; i < points.length; i++) {
    if (pinnedSet.has(i)) continue;

    let wSum = 0, sx = 0, sy = 0, sz = 0;
    const lo = Math.max(0, i - halfWin);
    const hi = Math.min(points.length - 1, i + halfWin);

    for (let j = lo; j <= hi; j++) {
      const spatialW = Math.exp(-((i - j) * (i - j)) / sigma_s2);
      const dx = points[i][0] - points[j][0];
      const dy = points[i][1] - points[j][1];
      const dz = points[i][2] - points[j][2];
      const rangeD2 = dx * dx + dy * dy + dz * dz;
      const rangeW = Math.exp(-rangeD2 / sigma_r2);
      const w = spatialW * rangeW;
      sx += points[j][0] * w;
      sy += points[j][1] * w;
      sz += points[j][2] * w;
      wSum += w;
    }

    if (wSum > 0) {
      result[i] = [sx / wSum, sy / wSum, sz / wSum];
    }
  }
  return result;
}

/**
 * Adaptive resampling: more points in high-curvature areas, fewer in straight sections.
 */
function adaptiveResample(points, minSpacing = 0.008, maxSpacing = 0.04) {
  if (!points || points.length < 2) return points || [];

  // Filter out any NaN points
  const validPoints = points.filter(p => p && p.length >= 3 && isFinite(p[0]) && isFinite(p[1]) && isFinite(p[2]));
  if (validPoints.length < 2) return validPoints;

  // Compute curvature at each point
  const curvature = new Float64Array(validPoints.length);
  for (let i = 1; i < validPoints.length - 1; i++) {
    const v1x = validPoints[i][0] - validPoints[i-1][0], v1y = validPoints[i][1] - validPoints[i-1][1], v1z = validPoints[i][2] - validPoints[i-1][2];
    const v2x = validPoints[i+1][0] - validPoints[i][0], v2y = validPoints[i+1][1] - validPoints[i][1], v2z = validPoints[i+1][2] - validPoints[i][2];
    const len1 = Math.sqrt(v1x*v1x + v1y*v1y + v1z*v1z);
    const len2 = Math.sqrt(v2x*v2x + v2y*v2y + v2z*v2z);
    if (len1 > 0 && len2 > 0) {
      const dot = (v1x*v2x + v1y*v2y + v1z*v2z) / (len1 * len2);
      curvature[i] = 1 - Math.max(-1, Math.min(1, dot)); // 0=straight, 2=U-turn
    }
  }

  // Build CatmullRom curve
  const vectors = validPoints.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const curve = new THREE.CatmullRomCurve3(vectors, false, 'centripetal', 0.5);
  const totalLen = curve.getLength();
  if (totalLen < 0.01) return validPoints;

  // Sample adaptively along arc length
  const result = [];
  let t = 0;
  while (t <= 1.0) {
    const pt = curve.getPoint(t);
    result.push([round3(pt.x), round3(pt.y), round3(pt.z)]);

    // Estimate curvature at current t
    const idx = Math.min(validPoints.length - 2, Math.max(0, Math.floor(t * (validPoints.length - 1))));
    const k = Math.max(curvature[idx], curvature[idx + 1] || 0);
    const spacing = maxSpacing + (minSpacing - maxSpacing) * Math.min(1, k / 0.5);
    t += spacing / totalLen;
  }

  // Ensure last point is included
  const last = validPoints[validPoints.length - 1];
  const lastResult = result[result.length - 1];
  if (Math.abs(last[0] - lastResult[0]) > 0.001 || Math.abs(last[1] - lastResult[1]) > 0.001 || Math.abs(last[2] - lastResult[2]) > 0.001) {
    result.push([...last]);
  }

  return result;
}

/**
 * Douglas-Peucker simplification with pinned points.
 */
function douglasPeucker(points, tolerance = 0.001, pinnedSet = new Set(), minPoints = 15) {
  if (points.length <= minPoints) return points;

  function pointToLineDist(p, a, b) {
    const abx = b[0]-a[0], aby = b[1]-a[1], abz = b[2]-a[2];
    const apx = p[0]-a[0], apy = p[1]-a[1], apz = p[2]-a[2];
    const abLen2 = abx*abx + aby*aby + abz*abz;
    if (abLen2 < 1e-12) return Math.sqrt(apx*apx + apy*apy + apz*apz);
    const t = Math.max(0, Math.min(1, (apx*abx + apy*aby + apz*abz) / abLen2));
    const dx = apx - abx*t, dy = apy - aby*t, dz = apz - abz*t;
    return Math.sqrt(dx*dx + dy*dy + dz*dz);
  }

  function dp(start, end) {
    if (end - start <= 1) return [start];
    let maxDist = 0, maxIdx = start;
    for (let i = start + 1; i < end; i++) {
      let d = pointToLineDist(points[i], points[start], points[end]);
      if (pinnedSet.has(i)) d = Infinity; // Never remove pinned points
      if (d > maxDist) { maxDist = d; maxIdx = i; }
    }
    if (maxDist > tolerance) {
      return [...dp(start, maxIdx), ...dp(maxIdx, end)];
    }
    return [start];
  }

  const indices = [...dp(0, points.length - 1), points.length - 1];
  const unique = [...new Set(indices)].sort((a, b) => a - b);

  // Ensure minimum point count (preserve pinned points)
  if (unique.length < minPoints) {
    const step = (points.length - 1) / (minPoints - 1);
    const idxSet = new Set([...pinnedSet]);
    for (let i = 0; i < minPoints; i++) {
      idxSet.add(Math.round(i * step));
    }
    const sorted = [...idxSet].sort((a, b) => a - b);
    return sorted.map(i => points[i]);
  }

  return unique.map(i => points[i]);
}

/**
 * Calibrate a single meridian path: resample → iterative project+smooth → simplify.
 */
function calibrateMeridianPath(meridianId) {
  const origPath = workingPaths[meridianId]?.path || [];
  const codes = ACUPOINT_CODES[meridianId] || [];
  const acuPositions = [];

  for (const code of codes) {
    const pos = workingAcupoints[code];
    if (pos) acuPositions.push(pos);
  }

  // Start from existing path if available, otherwise generate from acupoints
  let guidePoints = origPath.length >= 2 ? origPath : [];
  if (guidePoints.length < 2 && acuPositions.length >= 2) {
    const vectors = acuPositions.map(p => new THREE.Vector3(p[0], p[1], p[2]));
    const curve = new THREE.CatmullRomCurve3(vectors, false, 'centripetal', 0.5);
    const pts = curve.getPoints(Math.max(20, acuPositions.length * 4));
    guidePoints = pts.map(p => [round3(p.x), round3(p.y), round3(p.z)]);
  }

  if (guidePoints.length < 2) return null;

  // Phase 1: Adaptive resample
  let points = adaptiveResample(guidePoints);

  // Map acupoint positions to nearest path indices (pinned set)
  function buildPinnedMap(pts) {
    const pinMap = new Map(); // acuPosition index → path index
    const pinned = new Set();
    for (let ai = 0; ai < acuPositions.length; ai++) {
      const ap = acuPositions[ai];
      let bestIdx = 0, bestDist = Infinity;
      for (let i = 0; i < pts.length; i++) {
        const d = Math.hypot(ap[0]-pts[i][0], ap[1]-pts[i][1], ap[2]-pts[i][2]);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      pinMap.set(ai, bestIdx);
      pinned.add(bestIdx);
    }
    return { pinMap, pinned };
  }

  // Phase 2: Iterative project-smooth (3 iterations)
  const maxIter = 3;
  for (let iter = 0; iter < maxIter; iter++) {
    let maxDisp = 0;

    // Step A: Project all points with side guard
    for (let i = 0; i < points.length; i++) {
      const projected = projectToSurfaceSmooth(points[i], meridianId);
      const dx = projected[0]-points[i][0], dy = projected[1]-points[i][1], dz = projected[2]-points[i][2];
      maxDisp = Math.max(maxDisp, Math.sqrt(dx*dx + dy*dy + dz*dz));
      points[i] = projected;
    }

    // Step B: Pin acupoint positions (reuse map to avoid redundant search)
    const { pinMap, pinned: pinnedSet } = buildPinnedMap(points);
    for (const [ai, pathIdx] of pinMap) {
      points[pathIdx] = projectToSurfaceSmooth(acuPositions[ai], meridianId);
    }

    // Step C: Bilateral smooth
    points = bilateralSmooth(points, pinnedSet, 3, 0.01);

    // Step D: Convergence check
    if (maxDisp < 0.0005) break;
  }

  // Phase 3: Douglas-Peucker simplify (preserve acupoints)
  const { pinned: finalPinned } = buildPinnedMap(points);
  points = douglasPeucker(points, 0.001, finalPinned, 15);

  // Final NaN validation: filter out any remaining invalid points
  points = points.filter(p => p && p.length >= 3 && isFinite(p[0]) && isFinite(p[1]) && isFinite(p[2]));
  if (points.length < 2) return null;

  return points;
}

/**
 * Calibrate all acupoints for a meridian: project each to surface with side guard.
 */
function calibrateAcupoints(meridianId) {
  const codes = ACUPOINT_CODES[meridianId] || [];
  for (const code of codes) {
    const pos = workingAcupoints[code];
    if (pos && isFinite(pos[0]) && isFinite(pos[1]) && isFinite(pos[2])) {
      const projected = projectToSurfaceSmooth(pos, meridianId);
      // Only update if projection is valid
      if (projected && isFinite(projected[0]) && isFinite(projected[1]) && isFinite(projected[2])) {
        workingAcupoints[code] = projected;
      }
    }
  }
}

/**
 * AUTO-CALIBRATE ALL: one-click batch processing for all meridians.
 */
async function autoCalibratAllImpl() {
  if (!mergedBVH || modelMeshes.length === 0) {
    showToast('请先等待模型加载完成');
    return;
  }

  const progressEl = document.getElementById('calibrate-progress');
  const barEl = document.getElementById('calibrate-bar');
  const textEl = document.getElementById('calibrate-text');
  progressEl.style.display = 'block';

  try {
  // Ensure vertex normals are computed
  if (!mergedBVH.geometry.attributes.normal) {
    mergedBVH.geometry.computeVertexNormals();
  }

  // Build body center axis
  buildBodyCenterAxis();

  pushUndo(); // Save state for undo

  const startTime = performance.now();
  const total = MERIDIAN_META.length;

  for (let mi = 0; mi < total; mi++) {
    const m = MERIDIAN_META[mi];
    textEl.textContent = `${mi + 1}/${total} ${m.name}`;
    barEl.style.width = ((mi + 1) / total * 100) + '%';

    // Yield to UI for progress updates
    await new Promise(r => setTimeout(r, 0));

    // Calibrate acupoints first
    calibrateAcupoints(m.id);

    // Calibrate path
    const calibratedPath = calibrateMeridianPath(m.id);
    if (calibratedPath) {
      if (!workingPaths[m.id]) workingPaths[m.id] = {};
      workingPaths[m.id].path = calibratedPath;
    }

    calibrated[m.id] = true;
  }

  const elapsed = (performance.now() - startTime).toFixed(0);

  // Save to localStorage
  localStorage.setItem(`meridian-cal-${currentModel}`, JSON.stringify({
    paths: workingPaths,
    acupoints: workingAcupoints,
    calibrated,
  }));

  // Update UI
  updateVisualization();
  renderMeridianList();

  showToast(`✓ 全部校准完成！${total}条经络，耗时 ${elapsed}ms`);

  } catch (e) {
    showToast(`校准失败: ${e.message}`);
    console.error('Auto-calibrate error:', e);
  } finally {
    progressEl.style.display = 'none';
  }
}

// ==================== UNDO ====================
function pushUndo() {
  undoStack.push({
    paths: JSON.parse(JSON.stringify(workingPaths)),
    acupoints: JSON.parse(JSON.stringify(workingAcupoints)),
    calibrated: JSON.parse(JSON.stringify(calibrated)),
  });
  if (undoStack.length > 50) undoStack.shift();
}

// ==================== UI ====================
function renderMeridianList() {
  const el = document.getElementById('meridian-list');
  el.innerHTML = MERIDIAN_META.map(m => `
    <div class="meridian-item ${m.id === currentMeridianId ? 'active' : ''}"
         onclick="selectMeridian('${m.id}')">
      <span class="meridian-dot" style="background:${m.color}"></span>
      <span>${m.name}</span>
      <span class="meridian-id">${m.id}</span>
      ${calibrated[m.id] ? '<span class="meridian-check">&#10003;</span>' : ''}
    </div>
  `).join('');
}

function renderPointList() {
  const el = document.getElementById('point-list');
  const title = document.getElementById('points-title');

  if (editMode === 'path') {
    title.textContent = '路径点';
    const pts = workingPaths[currentMeridianId]?.path || [];
    el.innerHTML = pts.map((p, i) => {
      const x = isFinite(p[0]) ? p[0].toFixed(3) : 'NaN';
      const y = isFinite(p[1]) ? p[1].toFixed(3) : 'NaN';
      const z = isFinite(p[2]) ? p[2].toFixed(3) : 'NaN';
      const hasNaN = !isFinite(p[0]) || !isFinite(p[1]) || !isFinite(p[2]);
      return `
      <div class="point-item ${i === selectedPointIndex ? 'selected' : ''}" ${hasNaN ? 'style="color:#e74c3c"' : ''}
           onclick="selectPathPoint(${i})">
        <span class="point-idx">#${i}</span>
        <span class="point-coords">[${x}, ${y}, ${z}]</span>
        <span class="point-del" onclick="event.stopPropagation();deletePathPoint(${i})">&#10005;</span>
      </div>
    `;}).join('');
  } else {
    title.textContent = '穴位';
    const codes = ACUPOINT_CODES[currentMeridianId] || [];
    el.innerHTML = codes.map(code => {
      const pos = workingAcupoints[code];
      const name = ACUPOINT_NAMES[code] || '';
      return `
        <div class="point-item ${code === selectedAcupointCode ? 'selected' : ''}"
             onclick="selectAcupoint('${code}')">
          <span class="point-idx">${code}</span>
          <span class="point-name">${name}</span>
          <span class="point-coords">${pos ? `[${pos[0].toFixed(3)}, ${pos[1].toFixed(3)}, ${pos[2].toFixed(3)}]` : '--'}</span>
        </div>
      `;
    }).join('');
  }
}

function updateStatusHint() {
  const hint = document.getElementById('status-hint');
  const mode = document.getElementById('status-mode');
  if (interactMode === 'drag') {
    mode.textContent = '拖拽模式';
    hint.textContent = '拖拽旋转/平移/缩放模型，不会编辑点位';
    return;
  }
  if (editMode === 'path') {
    mode.textContent = '编辑: 路径';
    if (selectedPointIndex >= 0) {
      hint.textContent = '拖拽轴向箭头沿X/Y/Z移动 | 拖拽点贴合表面 | Shift+点击插入 | 右键删除 | X/Y/Z键切换轴';
    } else {
      hint.textContent = '拖拽路径点移动 | 点击模型添加点 | 「从穴位生成路径」自动连线';
    }
  } else {
    mode.textContent = '编辑: 穴位';
    if (selectedAcupointCode) {
      hint.textContent = `拖拽轴向箭头沿X/Y/Z移动 ${selectedAcupointCode} ${ACUPOINT_NAMES[selectedAcupointCode] || ''} | 拖拽点贴合表面 | X/Y/Z键切换轴`;
    } else {
      hint.textContent = '直接拖拽任意穴位移动 | 在列表选择穴位后点击模型放置';
    }
  }
}

// ==================== GLOBAL FUNCTIONS ====================
window.selectMeridian = function(id) {
  currentMeridianId = id;
  selectedPointIndex = -1;
  selectedAcupointCode = null;
  renderMeridianList();
  updateVisualization();
  updateStatusHint();
};

window.setMode = function(mode) {
  editMode = mode;
  selectedPointIndex = -1;
  selectedAcupointCode = null;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  updateVisualization();
  updateStatusHint();
};

window.switchModel = function(model) {
  // Save current model data first
  saveToStorage();
  currentModel = model;
  document.querySelectorAll('.model-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.model === model);
  });
  initWorkingData();
  loadModel(model);
  renderMeridianList();
  updateStatusHint();
};

window.setModelOpacity = function(val) {
  const opacity = parseInt(val) / 100;
  document.getElementById('opacity-val').textContent = val + '%';
  if (!modelGroup) return;
  modelGroup.traverse((child) => {
    if (child.isMesh && child.material) {
      child.material.transparent = opacity < 1.0;
      child.material.opacity = opacity;
      child.material.depthWrite = opacity >= 1.0;
      child.material.needsUpdate = true;
    }
  });
};

window.setInteractMode = function(mode) {
  interactMode = mode;
  document.querySelectorAll('[data-interact]').forEach(b => {
    b.classList.toggle('active', b.dataset.interact === mode);
  });
  renderer.domElement.style.cursor = mode === 'drag' ? 'grab' : 'crosshair';
  updateStatusHint();
};

window.selectPathPoint = function(i) {
  selectedPointIndex = (selectedPointIndex === i) ? -1 : i;
  updateVisualization();
  updateStatusHint();
};

window.selectAcupoint = function(code) {
  selectedAcupointCode = (selectedAcupointCode === code) ? null : code;
  updateVisualization();
  updateStatusHint();
};

window.deletePathPoint = function(i) {
  const mid = currentMeridianId;
  if (workingPaths[mid]?.path) {
    pushUndo();
    workingPaths[mid].path.splice(i, 1);
    if (selectedPointIndex >= i) selectedPointIndex = Math.max(-1, selectedPointIndex - 1);
    updateVisualization();
  }
};

window.snapToSurface = snapToSurface;

window.autoCalibratAll = function() {
  autoCalibratAllImpl();
};

window.autoGenPath = function() {
  generatePathFromAcupoints();
};

window.undoAction = function() {
  if (undoStack.length === 0) return;
  const state = undoStack.pop();
  workingPaths = state.paths;
  workingAcupoints = state.acupoints;
  if (state.calibrated) calibrated = state.calibrated;
  updateVisualization();
  renderMeridianList();
  showToast('已撤销');
};

window.clearPoints = function() {
  if (!confirm(`确定清空 ${currentMeridianId} 的${editMode === 'path' ? '路径' : '穴位'}数据？`)) return;
  pushUndo();
  if (editMode === 'path') {
    workingPaths[currentMeridianId] = { path: [] };
  } else {
    const codes = ACUPOINT_CODES[currentMeridianId] || [];
    codes.forEach(c => delete workingAcupoints[c]);
  }
  updateVisualization();
};

window.saveToStorage = function() {
  calibrated[currentMeridianId] = true;
  localStorage.setItem(`meridian-cal-${currentModel}`, JSON.stringify({
    paths: workingPaths,
    acupoints: workingAcupoints,
    calibrated,
  }));
  renderMeridianList();
  showToast('已暂存到浏览器');
};

window.exportCurrent = function() {
  calibrated[currentMeridianId] = true;
  saveToStorage();
  const mid = currentMeridianId;
  const data = {
    model: currentModel,
    meridianId: mid,
    path: workingPaths[mid]?.path || [],
    acupoints: {},
  };
  const codes = ACUPOINT_CODES[mid] || [];
  codes.forEach(c => {
    if (workingAcupoints[c]) data.acupoints[c] = workingAcupoints[c];
  });

  const json = JSON.stringify(data, null, 2);
  downloadFile(`calibration-${currentModel}-${mid}.json`, json);
  showToast(`已导出 ${mid} 数据`);
};

window.exportAll = function() {
  saveToStorage();
  const data = {
    model: currentModel,
    timestamp: new Date().toISOString(),
    paths: workingPaths,
    acupoints: workingAcupoints,
    calibrated,
  };
  const json = JSON.stringify(data, null, 2);
  downloadFile(`calibration-${currentModel}-all.json`, json);
  showToast('已导出全部数据');
};

window.syncToSource = async function() {
  saveToStorage();
  const data = {
    model: currentModel,
    paths: workingPaths,
    acupoints: workingAcupoints,
  };
  try {
    const resp = await fetch('/api/save-calibration', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    const result = await resp.json();
    if (result.ok) {
      showToast(`已同步 ${currentModel} 数据到 TS 源码`);
    } else {
      showToast(`同步失败: ${result.error}`);
    }
  } catch (e) {
    showToast(`同步失败: ${e.message}（请确认 calibrator-server.mjs 已启动）`);
  }
};

// ==================== HELPERS ====================
function round3(n) { return Math.round(n * 1000) / 1000; }

function isValidVec3(p) {
  return p && p.length >= 3 && isFinite(p[0]) && isFinite(p[1]) && isFinite(p[2]);
}

/**
 * Create a text sprite label for 3D annotations.
 */
function createTextSprite(text, color = '#ffffff', fontSize = 48, bgColor = 'rgba(0,0,0,0.6)') {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const padding = 8;
  ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
  const metrics = ctx.measureText(text);
  const textWidth = metrics.width;
  canvas.width = Math.ceil(textWidth + padding * 2);
  canvas.height = Math.ceil(fontSize * 1.4 + padding * 2);

  // Background
  ctx.fillStyle = bgColor;
  const r = 6;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(canvas.width - r, 0);
  ctx.quadraticCurveTo(canvas.width, 0, canvas.width, r);
  ctx.lineTo(canvas.width, canvas.height - r);
  ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - r, canvas.height);
  ctx.lineTo(r, canvas.height);
  ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.fill();

  // Text
  ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.renderOrder = 1000;
  // Scale proportionally: sprite width in world units
  const worldScale = 0.04;
  sprite.scale.set(worldScale * (canvas.width / canvas.height), worldScale, 1);
  return sprite;
}

function downloadFile(name, content) {
  const blob = new Blob([content], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

// ==================== RESIZE ====================
function onResize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// ==================== RENDER LOOP ====================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ==================== INIT ====================
initWorkingData();
onResize();
renderMeridianList();
updateStatusHint();
loadModel(currentModel);
animate();

</script>
