<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经络坐标校正工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; overflow: hidden; height: 100vh; }
#app { display: flex; height: 100vh; }

/* Sidebar */
#sidebar { width: 280px; background: #16213e; display: flex; flex-direction: column; border-right: 1px solid #0f3460; overflow: hidden; }
.sidebar-section { padding: 12px; border-bottom: 1px solid #0f3460; }
.sidebar-section h3 { font-size: 13px; color: #7ec8e3; margin-bottom: 8px; }
.sidebar-scroll { flex: 1; overflow-y: auto; }

/* Meridian list */
.meridian-item { display: flex; align-items: center; padding: 6px 12px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; transition: background 0.15s; }
.meridian-item:hover { background: #1a3a5c; }
.meridian-item.active { background: #1a3a5c; border-left-color: #7ec8e3; }
.meridian-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
.meridian-id { color: #999; font-size: 11px; margin-left: auto; }
.meridian-check { color: #4caf50; margin-left: 4px; font-size: 11px; }

/* Mode toggle */
.mode-toggle { display: flex; gap: 4px; }
.mode-btn { flex: 1; padding: 6px; border: 1px solid #0f3460; background: transparent; color: #999; font-size: 12px; cursor: pointer; border-radius: 4px; transition: all 0.15s; }
.mode-btn.active { background: #0f3460; color: #7ec8e3; border-color: #7ec8e3; }

/* Point list */
.point-list { max-height: 300px; overflow-y: auto; }
.point-item { display: flex; align-items: center; padding: 4px 12px; font-size: 11px; font-family: monospace; cursor: pointer; transition: background 0.15s; }
.point-item:hover { background: #1a3a5c; }
.point-item.selected { background: #0f3460; color: #7ec8e3; }
.point-idx { width: 30px; color: #666; }
.point-coords { flex: 1; }
.point-name { color: #999; font-size: 10px; }
.point-del { color: #e74c3c; cursor: pointer; opacity: 0; padding: 0 4px; }
.point-item:hover .point-del { opacity: 1; }

/* Actions */
.actions { padding: 12px; display: flex; flex-wrap: wrap; gap: 4px; border-top: 1px solid #0f3460; }
.btn { padding: 5px 10px; border: 1px solid #0f3460; background: #16213e; color: #e0e0e0; font-size: 11px; cursor: pointer; border-radius: 3px; transition: all 0.15s; }
.btn:hover { background: #0f3460; border-color: #7ec8e3; }
.btn.primary { background: #0f3460; color: #7ec8e3; }
.btn.danger { color: #e74c3c; border-color: #e74c3c; }

/* Viewport */
#viewport { flex: 1; position: relative; }
#viewport canvas { display: block; }

/* Status bar */
#statusbar { position: absolute; bottom: 0; left: 280px; right: 0; height: 28px; background: rgba(22, 33, 62, 0.9); display: flex; align-items: center; padding: 0 12px; font-size: 11px; color: #999; border-top: 1px solid #0f3460; gap: 20px; z-index: 10; }
#statusbar .coords { color: #7ec8e3; font-family: monospace; }
#statusbar .hint { color: #666; }

/* Info overlay */
#info-overlay { position: absolute; top: 10px; right: 10px; background: rgba(22, 33, 62, 0.9); border: 1px solid #0f3460; border-radius: 6px; padding: 10px 14px; font-size: 12px; z-index: 10; max-width: 250px; }
#info-overlay h4 { color: #7ec8e3; margin-bottom: 4px; }

/* Toast */
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #4caf50; color: white; padding: 8px 20px; border-radius: 4px; font-size: 13px; z-index: 100; animation: fadeInOut 2s forwards; }
@keyframes fadeInOut { 0% { opacity: 0; transform: translateX(-50%) translateY(-10px); } 10% { opacity: 1; transform: translateX(-50%) translateY(0); } 80% { opacity: 1; } 100% { opacity: 0; } }

/* Model selector */
.model-selector { display: flex; gap: 4px; margin-bottom: 8px; }
.model-btn { flex: 1; padding: 5px; border: 1px solid #0f3460; background: transparent; color: #999; font-size: 12px; cursor: pointer; border-radius: 4px; }
.model-btn.active { background: #0f3460; color: #7ec8e3; border-color: #7ec8e3; }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #16213e; }
::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sidebar-section">
      <h3>模型</h3>
      <div class="model-selector">
        <button class="model-btn active" data-model="female" onclick="switchModel('female')">女性</button>
        <button class="model-btn" data-model="male" onclick="switchModel('male')">男性</button>
      </div>
      <h3 style="margin-top:8px">模型透明度 <span id="opacity-val">100%</span></h3>
      <input type="range" id="opacity-slider" min="10" max="100" value="100" style="width:100%;accent-color:#7ec8e3;margin-bottom:8px" oninput="setModelOpacity(this.value)">
      <h3>交互模式</h3>
      <div class="mode-toggle">
        <button class="mode-btn" data-interact="drag" onclick="setInteractMode('drag')">拖拽</button>
        <button class="mode-btn active" data-interact="edit" onclick="setInteractMode('edit')">编辑</button>
      </div>
      <h3 style="margin-top:8px">编辑模式</h3>
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="path" onclick="setMode('path')">路径</button>
        <button class="mode-btn" data-mode="acupoint" onclick="setMode('acupoint')">穴位</button>
      </div>
    </div>
    <div class="sidebar-section">
      <h3>经络列表</h3>
    </div>
    <div class="sidebar-scroll" id="meridian-list"></div>
    <div class="sidebar-section">
      <h3 id="points-title">路径点</h3>
      <div class="point-list" id="point-list"></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="undoAction()" title="Ctrl+Z">撤销</button>
      <button class="btn" onclick="snapToSurface()">贴合表面</button>
      <button class="btn danger" onclick="clearPoints()">清空</button>
      <button class="btn primary" onclick="exportCurrent()">导出当前</button>
      <button class="btn primary" onclick="exportAll()">导出全部</button>
      <button class="btn primary" onclick="syncToSource()" style="background:#2ed573;border-color:#2ed573;color:#fff">同步到源码</button>
      <button class="btn" onclick="saveToStorage()">暂存</button>
    </div>
  </div>
  <div id="viewport"></div>
  <div id="statusbar">
    <span id="status-mode">模式: 路径</span>
    <span id="status-coords" class="coords">--</span>
    <span id="status-hint" class="hint">点击模型表面添加路径点</span>
  </div>
</div>

let modelGroup = null;
let modelMeshes = [];

const loader = new GLTFLoader();

function loadModel(modelType) {
  if (modelGroup) {
    scene.remove(modelGroup);
    modelGroup = null;
    modelMeshes = [];
    if (mergedBVH) {
      mergedBVH.geometry.dispose();
      mergedBVH = null;
    }
  }
  const config = MODEL_CONFIGS[modelType];
  loader.load(config.url, (gltf) => {
    modelGroup = new THREE.Group();
    const s = config.scale;
    const inner = new THREE.Group();
    inner.scale.set(s, s, s);
    inner.position.set(0, config.offsetY * s, 0);
    inner.add(gltf.scene);
    modelGroup.add(inner);
    scene.add(modelGroup);

    // Collect meshes for raycasting
    modelMeshes = [];
    modelGroup.traverse((child) => {
      if (child.isMesh) {
        // Setup material for transparency support
        if (child.material) {
          const mat = child.material.clone();
          const slider = document.getElementById('opacity-slider');
          const opVal = slider ? parseInt(slider.value) / 100 : 1.0;
          mat.transparent = opVal < 1.0;
          mat.opacity = opVal;
          mat.depthWrite = opVal >= 1.0;
          mat.side = THREE.DoubleSide;
          child.material = mat;
        }
        modelMeshes.push(child);
      }
    });

    // Build merged BVH for surface projection
    buildMergedBVH();

    showToast(`${modelType === 'female' ? '女性' : '男性'}模型加载完成`);
    updateVisualization();
  }, undefined, (err) => {
    showToast('模型加载失败: ' + err.message);
  });
}

// ==================== VISUALIZATION ====================
let pathLine = null;
let pathPoints = [];
let acupointMarkers = [];
const vizGroup = new THREE.Group();
scene.add(vizGroup);

function clearVisualization() {
  while (vizGroup.children.length > 0) {
    const child = vizGroup.children[0];
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
    vizGroup.remove(child);
  }
  pathPoints = [];
  acupointMarkers = [];
  pathLine = null;
}

function updateVisualization() {
  clearVisualization();
  const mid = currentMeridianId;
  const meta = MERIDIAN_META.find(m => m.id === mid);
  if (!meta) return;
  const color = new THREE.Color(meta.color);

  if (editMode === 'path') {
    // Draw path as tube for visible thickness
    const pathData = workingPaths[mid]?.path || [];
    if (pathData.length > 1) {
      const pts = pathData.map(p => new THREE.Vector3(p[0], p[1], p[2]));
      const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.3);
      const segments = Math.max(20, pts.length * 8);
      const tubeGeo = new THREE.TubeGeometry(curve, segments, 0.002, 6, false);
      const tubeMat = new THREE.MeshBasicMaterial({ color });
      pathLine = new THREE.Mesh(tubeGeo, tubeMat);
      vizGroup.add(pathLine);
    }

    // Control point spheres (small)
    pathData.forEach((p, i) => {
      const isSelected = i === selectedPointIndex;
      const geo = new THREE.SphereGeometry(isSelected ? 0.004 : 0.003, 8, 8);
      const mat = new THREE.MeshBasicMaterial({
        color: isSelected ? 0xffffff : color,
        emissive: isSelected ? color : undefined,
      });
      const sphere = new THREE.Mesh(geo, mat);
      sphere.position.set(p[0], p[1], p[2]);
      sphere.userData = { type: 'pathPoint', index: i };
      vizGroup.add(sphere);
      pathPoints.push(sphere);
    });
  } else {
    // Acupoint mode: show path as thin tube + acupoint markers
    const pathData = workingPaths[mid]?.path || [];
    if (pathData.length > 1) {
      const pts = pathData.map(p => new THREE.Vector3(p[0], p[1], p[2]));
      const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.3);
      const segments = Math.max(20, pts.length * 8);
      const tubeGeo = new THREE.TubeGeometry(curve, segments, 0.001, 6, false);
      const tubeMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.4 });
      vizGroup.add(new THREE.Mesh(tubeGeo, tubeMat));
    }

    // Acupoint markers (larger, always visible)
    const codes = ACUPOINT_CODES[mid] || [];
    codes.forEach((code) => {
      const pos = workingAcupoints[code];
      if (!pos) return;
      const isSelected = code === selectedAcupointCode;
      const geo = new THREE.SphereGeometry(isSelected ? 0.008 : 0.006, 10, 10);
      const mat = new THREE.MeshBasicMaterial({
        color: isSelected ? 0xffffff : color,
        depthTest: false,
      });
      const sphere = new THREE.Mesh(geo, mat);
      sphere.position.set(pos[0], pos[1], pos[2]);
      sphere.renderOrder = 999;
      sphere.userData = { type: 'acupoint', code };
      vizGroup.add(sphere);
      acupointMarkers.push(sphere);
    });
  }

  renderPointList();
}

// ==================== INTERACTION ====================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let mouseDownPos = { x: 0, y: 0 };
let isDragging = false;

function getMouseNDC(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  return {
    x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
    y: -((e.clientY - rect.top) / rect.height) * 2 + 1,
  };
}

renderer.domElement.addEventListener('mousedown', (e) => {
  mouseDownPos = { x: e.clientX, y: e.clientY };
  isDragging = false;
  isDraggingAcupoint = false;
  acuDragUndoPushed = false;

  // In acupoint edit mode, check if mousedown on a selected acupoint to start drag
  if (e.button === 0 && interactMode === 'edit' && editMode === 'acupoint' && selectedAcupointCode) {
    const ndc = getMouseNDC(e);
    mouse.set(ndc.x, ndc.y);
    raycaster.setFromCamera(mouse, camera);
    const acuHits = raycaster.intersectObjects(acupointMarkers, false);
    if (acuHits.length > 0 && acuHits[0].object.userData.code === selectedAcupointCode) {
      isDraggingAcupoint = true;
      controls.enabled = false; // Disable orbit while dragging acupoint
    }
  }
});

renderer.domElement.addEventListener('mousemove', (e) => {
  const dx = e.clientX - mouseDownPos.x;
  const dy = e.clientY - mouseDownPos.y;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) isDragging = true;

  // In drag mode, hide cursor marker
  if (interactMode === 'drag') {
    cursorMarker.visible = false;
    return;
  }

  // Update cursor
  const ndc = getMouseNDC(e);
  mouse.set(ndc.x, ndc.y);
  raycaster.setFromCamera(mouse, camera);

  // Dragging an acupoint: move it to mouse position on model surface
  if (isDraggingAcupoint && selectedAcupointCode) {
    const modelHits = raycaster.intersectObjects(modelMeshes, true);
    if (modelHits.length > 0) {
      if (!acuDragUndoPushed) {
        pushUndo();
        acuDragUndoPushed = true;
      }
      const p = modelHits[0].point;
      const newCoord = [round3(p.x), round3(p.y), round3(p.z)];
      // Update acupoint position
      workingAcupoints[selectedAcupointCode] = newCoord;
      // Update nearest path point
      const mid = currentMeridianId;
      const pathArr = workingPaths[mid]?.path;
      if (pathArr) {
        let bestIdx = -1, bestDist = Infinity;
        for (let i = 0; i < pathArr.length; i++) {
          const pp = pathArr[i];
          const d = Math.hypot(pp[0]-newCoord[0], pp[1]-newCoord[1], pp[2]-newCoord[2]);
          if (d < bestDist) { bestDist = d; bestIdx = i; }
        }
        if (bestIdx >= 0 && bestDist < 0.03) {
          pathArr[bestIdx] = [...newCoord];
        }
      }
      // Update sphere position directly for smooth visual (skip full rebuild)
      const marker = acupointMarkers.find(m => m.userData.code === selectedAcupointCode);
      if (marker) marker.position.set(newCoord[0], newCoord[1], newCoord[2]);
      cursorMarker.position.copy(modelHits[0].point);
      cursorMarker.visible = true;
      document.getElementById('status-coords').textContent =
        `X: ${p.x.toFixed(3)}  Y: ${p.y.toFixed(3)}  Z: ${p.z.toFixed(3)}`;
    }
    return;
  }

  const hits = raycaster.intersectObjects(modelMeshes, true);
  if (hits.length > 0) {
    const p = hits[0].point;
    cursorMarker.position.copy(p);
    cursorMarker.visible = true;
    document.getElementById('status-coords').textContent =
      `X: ${p.x.toFixed(3)}  Y: ${p.y.toFixed(3)}  Z: ${p.z.toFixed(3)}`;
  } else {
    cursorMarker.visible = false;
    document.getElementById('status-coords').textContent = '--';
  }
});

renderer.domElement.addEventListener('mouseup', (e) => {
  // End acupoint drag
  if (isDraggingAcupoint) {
    isDraggingAcupoint = false;
    controls.enabled = true;
    if (acuDragUndoPushed) {
      // Drag completed, do a full visualization rebuild
      updateVisualization();
    }
    return;
  }
  if (isDragging) return;
  if (interactMode === 'drag') return; // Drag mode: no editing
  if (e.button === 2) {
    // Right-click: delete selected point
    handleRightClick(e);
    return;
  }
  if (e.button !== 0) return;
  handleClick(e);
});

renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

function handleClick(e) {
  const ndc = getMouseNDC(e);
  mouse.set(ndc.x, ndc.y);
  raycaster.setFromCamera(mouse, camera);

  if (editMode === 'path') {
    // Check if clicked on existing path point
    const pointHits = raycaster.intersectObjects(pathPoints, false);
    if (pointHits.length > 0) {
      const idx = pointHits[0].object.userData.index;
      selectedPointIndex = (selectedPointIndex === idx) ? -1 : idx;
      updateVisualization();
      return;
    }

    // Click on model surface
    const modelHits = raycaster.intersectObjects(modelMeshes, true);
    if (modelHits.length > 0) {
      const p = modelHits[0].point;
      const coord = [round3(p.x), round3(p.y), round3(p.z)];
      const mid = currentMeridianId;

      if (!workingPaths[mid]) workingPaths[mid] = { path: [] };

      if (selectedPointIndex >= 0 && e.shiftKey) {
        // Shift+click: insert after selected
        pushUndo();
        workingPaths[mid].path.splice(selectedPointIndex + 1, 0, coord);
        selectedPointIndex = selectedPointIndex + 1;
      } else if (selectedPointIndex >= 0) {
        // Move selected point
        pushUndo();
        workingPaths[mid].path[selectedPointIndex] = coord;
      } else {
        // Add at end
        pushUndo();
        workingPaths[mid].path.push(coord);
        selectedPointIndex = workingPaths[mid].path.length - 1;
      }
      updateVisualization();
    }
  } else {
    // Acupoint mode
    // Check if clicked on existing acupoint
    const acuHits = raycaster.intersectObjects(acupointMarkers, false);
    if (acuHits.length > 0) {
      const code = acuHits[0].object.userData.code;
      selectedAcupointCode = (selectedAcupointCode === code) ? null : code;
      updateVisualization();
      return;
    }

    // Click on model surface
    if (selectedAcupointCode) {
      const modelHits = raycaster.intersectObjects(modelMeshes, true);
      if (modelHits.length > 0) {
        const p = modelHits[0].point;
        pushUndo();
        const newCoord = [round3(p.x), round3(p.y), round3(p.z)];
        // Also update the nearest path point so the line follows
        const oldPos = workingAcupoints[selectedAcupointCode];
        const pathArr = workingPaths[mid]?.path;
        if (oldPos && pathArr) {
          let bestIdx = -1, bestDist = Infinity;
          for (let i = 0; i < pathArr.length; i++) {
            const pp = pathArr[i];
            const d = Math.hypot(pp[0]-oldPos[0], pp[1]-oldPos[1], pp[2]-oldPos[2]);
            if (d < bestDist) { bestDist = d; bestIdx = i; }
          }
          if (bestIdx >= 0 && bestDist < 0.02) {
            pathArr[bestIdx] = [...newCoord];
          }
        }
        workingAcupoints[selectedAcupointCode] = newCoord;
        updateVisualization();
      }
    }
  }
}

function handleRightClick(e) {
  if (editMode === 'path' && selectedPointIndex >= 0) {
    const mid = currentMeridianId;
    if (workingPaths[mid]?.path) {
      pushUndo();
      workingPaths[mid].path.splice(selectedPointIndex, 1);
      selectedPointIndex = -1;
      updateVisualization();
    }
  }
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    selectedPointIndex = -1;
    selectedAcupointCode = null;
    updateVisualization();
  }
  if (e.ctrlKey && e.key === 'z') {
    undoAction();
    e.preventDefault();
  }
  // Arrow keys to navigate points
  if (editMode === 'path' && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    const pts = workingPaths[currentMeridianId]?.path || [];
    if (pts.length === 0) return;
    if (e.key === 'ArrowUp') {
      selectedPointIndex = Math.max(0, selectedPointIndex - 1);
    } else {
      selectedPointIndex = Math.min(pts.length - 1, selectedPointIndex + 1);
    }
    updateVisualization();
    e.preventDefault();
  }
});

// ==================== SURFACE PROJECTION (BVH) ====================
function buildMergedBVH() {
  if (modelMeshes.length === 0) return;
  showToast('正在构建 BVH...');

  // Merge all mesh geometries into world space
  let totalVerts = 0, totalIdx = 0;
  const geoInfos = [];

  for (const mesh of modelMeshes) {
    mesh.updateMatrixWorld(true);
    const geo = mesh.geometry;
    if (!geo || !geo.attributes.position) continue;
    const posAttr = geo.attributes.position;
    const idxAttr = geo.index;
    const vertCount = posAttr.count;
    const faceCount = idxAttr ? idxAttr.count : vertCount;
    geoInfos.push({ mesh, geo, posAttr, idxAttr, vertCount, faceCount, vertOffset: totalVerts });
    totalVerts += vertCount;
    totalIdx += faceCount;
  }

  const mergedPos = new Float32Array(totalVerts * 3);
  const mergedIdx = new Uint32Array(totalIdx);
  let posOff = 0, idxOff = 0;

  const tmpVec = new THREE.Vector3();
  for (const info of geoInfos) {
    // Transform positions to world space
    for (let i = 0; i < info.vertCount; i++) {
      tmpVec.set(
        info.posAttr.getX(i),
        info.posAttr.getY(i),
        info.posAttr.getZ(i)
      );
      tmpVec.applyMatrix4(info.mesh.matrixWorld);
      mergedPos[(posOff + i) * 3] = tmpVec.x;
      mergedPos[(posOff + i) * 3 + 1] = tmpVec.y;
      mergedPos[(posOff + i) * 3 + 2] = tmpVec.z;
    }
    // Copy indices with offset
    if (info.idxAttr) {
      for (let i = 0; i < info.faceCount; i++) {
        mergedIdx[idxOff + i] = info.idxAttr.getX(i) + posOff;
      }
    } else {
      for (let i = 0; i < info.faceCount; i++) {
        mergedIdx[idxOff + i] = posOff + i;
      }
    }
    posOff += info.vertCount;
    idxOff += info.faceCount;
  }

  const mergedGeo = new THREE.BufferGeometry();
  mergedGeo.setAttribute('position', new THREE.BufferAttribute(mergedPos, 3));
  mergedGeo.setIndex(new THREE.BufferAttribute(mergedIdx, 1));
  mergedGeo.computeVertexNormals();

  const bvh = new MeshBVH(mergedGeo);
  mergedBVH = { geometry: mergedGeo, bvh };
  showToast(`BVH 构建完成 (${totalVerts} 顶点)`);
}

function projectPointToSurface(point, offset = 0.006) {
  if (!mergedBVH) return point;
  const p = new THREE.Vector3(point[0], point[1], point[2]);
  const target = { point: new THREE.Vector3(), distance: Infinity, faceIndex: 0 };
  mergedBVH.bvh.closestPointToPoint(p, target);

  if (target.distance < Infinity) {
    // Get face normal
    const faceIdx = target.faceIndex;
    const idxAttr = mergedBVH.geometry.index;
    const posAttr = mergedBVH.geometry.attributes.position;
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    const ia = idxAttr.getX(faceIdx * 3);
    const ib = idxAttr.getX(faceIdx * 3 + 1);
    const ic = idxAttr.getX(faceIdx * 3 + 2);
    a.fromBufferAttribute(posAttr, ia);
    b.fromBufferAttribute(posAttr, ib);
    c.fromBufferAttribute(posAttr, ic);
    const normal = new THREE.Vector3();
    const edge1 = b.clone().sub(a);
    const edge2 = c.clone().sub(a);
    normal.crossVectors(edge1, edge2).normalize();

    const projected = target.point.clone().add(normal.multiplyScalar(offset));
    return [round3(projected.x), round3(projected.y), round3(projected.z)];
  }
  return point;
}

function snapToSurface() {
  if (modelMeshes.length === 0) { showToast('模型未加载'); return; }
  pushUndo();
  const mid = currentMeridianId;

  if (editMode === 'path') {
    const pts = workingPaths[mid]?.path || [];
    if (pts.length === 0) { showToast('无路径点'); return; }
    showToast(`正在投影 ${pts.length} 个路径点...`);
    for (let i = 0; i < pts.length; i++) {
      pts[i] = projectPointToSurface(pts[i]);
    }
    workingPaths[mid].path = pts;
  } else {
    const codes = ACUPOINT_CODES[mid] || [];
    const validCodes = codes.filter(c => workingAcupoints[c]);
    if (validCodes.length === 0) { showToast('无穴位数据'); return; }
    showToast(`正在投影 ${validCodes.length} 个穴位...`);
    for (const code of validCodes) {
      workingAcupoints[code] = projectPointToSurface(workingAcupoints[code]);
    }
  }

  updateVisualization();
  showToast('贴合表面完成');
}

// ==================== UNDO ====================
function pushUndo() {
  undoStack.push({
    paths: JSON.parse(JSON.stringify(workingPaths)),
    acupoints: JSON.parse(JSON.stringify(workingAcupoints)),
  });
  if (undoStack.length > 50) undoStack.shift();
}

// ==================== UI ====================
function renderMeridianList() {
  const el = document.getElementById('meridian-list');
  el.innerHTML = MERIDIAN_META.map(m => `
    <div class="meridian-item ${m.id === currentMeridianId ? 'active' : ''}"
         onclick="selectMeridian('${m.id}')">
      <span class="meridian-dot" style="background:${m.color}"></span>
      <span>${m.name}</span>
      <span class="meridian-id">${m.id}</span>
      ${calibrated[m.id] ? '<span class="meridian-check">&#10003;</span>' : ''}
    </div>
  `).join('');
}

function renderPointList() {
  const el = document.getElementById('point-list');
  const title = document.getElementById('points-title');

  if (editMode === 'path') {
    title.textContent = '路径点';
    const pts = workingPaths[currentMeridianId]?.path || [];
    el.innerHTML = pts.map((p, i) => `
      <div class="point-item ${i === selectedPointIndex ? 'selected' : ''}"
           onclick="selectPathPoint(${i})">
        <span class="point-idx">#${i}</span>
        <span class="point-coords">[${p[0].toFixed(3)}, ${p[1].toFixed(3)}, ${p[2].toFixed(3)}]</span>
        <span class="point-del" onclick="event.stopPropagation();deletePathPoint(${i})">&#10005;</span>
      </div>
    `).join('');
  } else {
    title.textContent = '穴位';
    const codes = ACUPOINT_CODES[currentMeridianId] || [];
    el.innerHTML = codes.map(code => {
      const pos = workingAcupoints[code];
      const name = ACUPOINT_NAMES[code] || '';
      return `
        <div class="point-item ${code === selectedAcupointCode ? 'selected' : ''}"
             onclick="selectAcupoint('${code}')">
          <span class="point-idx">${code}</span>
          <span class="point-name">${name}</span>
          <span class="point-coords">${pos ? `[${pos[0].toFixed(3)}, ${pos[1].toFixed(3)}, ${pos[2].toFixed(3)}]` : '--'}</span>
        </div>
      `;
    }).join('');
  }
}

function updateStatusHint() {
  const hint = document.getElementById('status-hint');
  const mode = document.getElementById('status-mode');
  if (interactMode === 'drag') {
    mode.textContent = '拖拽模式';
    hint.textContent = '拖拽旋转/平移/缩放模型，不会编辑点位';
    return;
  }
  if (editMode === 'path') {
    mode.textContent = '编辑: 路径';
    if (selectedPointIndex >= 0) {
      hint.textContent = '点击模型移动选中点 | Shift+点击插入 | 右键删除 | ESC取消选择';
    } else {
      hint.textContent = '点击模型表面添加路径点 | 点击已有点选中';
    }
  } else {
    mode.textContent = '编辑: 穴位';
    if (selectedAcupointCode) {
      hint.textContent = `拖拽移动 ${selectedAcupointCode} ${ACUPOINT_NAMES[selectedAcupointCode] || ''} | 点击模型放置 | ESC取消`;
    } else {
      hint.textContent = '点击穴位球体选中，或在列表选择穴位';
    }
  }
}

// ==================== GLOBAL FUNCTIONS ====================
window.selectMeridian = function(id) {
  currentMeridianId = id;
  selectedPointIndex = -1;
  selectedAcupointCode = null;
  renderMeridianList();
  updateVisualization();
  updateStatusHint();
};

window.setMode = function(mode) {
  editMode = mode;
  selectedPointIndex = -1;
  selectedAcupointCode = null;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  updateVisualization();
  updateStatusHint();
};

window.switchModel = function(model) {
  // Save current model data first
  saveToStorage();
  currentModel = model;
  document.querySelectorAll('.model-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.model === model);
  });
  initWorkingData();
  loadModel(model);
  renderMeridianList();
  updateStatusHint();
};

window.setModelOpacity = function(val) {
  const opacity = parseInt(val) / 100;
  document.getElementById('opacity-val').textContent = val + '%';
  if (!modelGroup) return;
  modelGroup.traverse((child) => {
    if (child.isMesh && child.material) {
      child.material.transparent = opacity < 1.0;
      child.material.opacity = opacity;
      child.material.depthWrite = opacity >= 1.0;
      child.material.needsUpdate = true;
    }
  });
};

window.setInteractMode = function(mode) {
  interactMode = mode;
  document.querySelectorAll('[data-interact]').forEach(b => {
    b.classList.toggle('active', b.dataset.interact === mode);
  });
  renderer.domElement.style.cursor = mode === 'drag' ? 'grab' : 'crosshair';
  updateStatusHint();
};

window.selectPathPoint = function(i) {
  selectedPointIndex = (selectedPointIndex === i) ? -1 : i;
  updateVisualization();
  updateStatusHint();
};

window.selectAcupoint = function(code) {
  selectedAcupointCode = (selectedAcupointCode === code) ? null : code;
  updateVisualization();
  updateStatusHint();
};

window.deletePathPoint = function(i) {
  const mid = currentMeridianId;
  if (workingPaths[mid]?.path) {
    pushUndo();
    workingPaths[mid].path.splice(i, 1);
    if (selectedPointIndex >= i) selectedPointIndex = Math.max(-1, selectedPointIndex - 1);
    updateVisualization();
  }
};

window.undoAction = function() {
  if (undoStack.length === 0) return;
  const state = undoStack.pop();
  workingPaths = state.paths;
  workingAcupoints = state.acupoints;
  updateVisualization();
  showToast('已撤销');
};

window.clearPoints = function() {
  if (!confirm(`确定清空 ${currentMeridianId} 的${editMode === 'path' ? '路径' : '穴位'}数据？`)) return;
  pushUndo();
  if (editMode === 'path') {
    workingPaths[currentMeridianId] = { path: [] };
  } else {
    const codes = ACUPOINT_CODES[currentMeridianId] || [];
    codes.forEach(c => delete workingAcupoints[c]);
  }
  updateVisualization();
};

window.saveToStorage = function() {
  calibrated[currentMeridianId] = true;
  localStorage.setItem(`meridian-cal-${currentModel}`, JSON.stringify({
    paths: workingPaths,
    acupoints: workingAcupoints,
    calibrated,
  }));
  renderMeridianList();
  showToast('已暂存到浏览器');
};

window.exportCurrent = function() {
  calibrated[currentMeridianId] = true;
  saveToStorage();
  const mid = currentMeridianId;
  const data = {
    model: currentModel,
    meridianId: mid,
    path: workingPaths[mid]?.path || [],
    acupoints: {},
  };
  const codes = ACUPOINT_CODES[mid] || [];
  codes.forEach(c => {
    if (workingAcupoints[c]) data.acupoints[c] = workingAcupoints[c];
  });

  const json = JSON.stringify(data, null, 2);
  downloadFile(`calibration-${currentModel}-${mid}.json`, json);
  showToast(`已导出 ${mid} 数据`);
};

window.exportAll = function() {
  saveToStorage();
  const data = {
    model: currentModel,
    timestamp: new Date().toISOString(),
    paths: workingPaths,
    acupoints: workingAcupoints,
    calibrated,
  };
  const json = JSON.stringify(data, null, 2);
  downloadFile(`calibration-${currentModel}-all.json`, json);
  showToast('已导出全部数据');
};

window.syncToSource = async function() {
  saveToStorage();
  const data = {
    model: currentModel,
    paths: workingPaths,
    acupoints: workingAcupoints,
  };
  try {
    const resp = await fetch('/api/save-calibration', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    const result = await resp.json();
    if (result.ok) {
      showToast(`已同步 ${currentModel} 数据到 TS 源码`);
    } else {
      showToast(`同步失败: ${result.error}`);
    }
  } catch (e) {
    showToast(`同步失败: ${e.message}（请确认 calibrator-server.mjs 已启动）`);
  }
};

// ==================== HELPERS ====================
function round3(n) { return Math.round(n * 1000) / 1000; }

function downloadFile(name, content) {
  const blob = new Blob([content], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2000);
}

// ==================== RESIZE ====================
function onResize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// ==================== RENDER LOOP ====================
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

// ==================== INIT ====================
initWorkingData();
onResize();
renderMeridianList();
updateStatusHint();
loadModel(currentModel);
animate();

</script>
