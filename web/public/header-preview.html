<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Header 配色方案预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
  h1 { text-align: center; color: #333; margin-bottom: 24px; font-size: 20px; }
  .scheme { margin-bottom: 32px; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
  .scheme-label { padding: 8px 16px; background: #fff; font-weight: 600; font-size: 14px; color: #666; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; }
  .scheme-label .tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; color: #fff; }
  .preview { display: flex; height: 320px; }
  .sidebar { width: 200px; flex-shrink: 0; display: flex; flex-direction: column; }
  .sidebar-title { padding: 16px; text-align: center; font-weight: bold; font-size: 16px; letter-spacing: 2px; }
  .menu-item { padding: 10px 24px; font-size: 14px; color: rgba(255,255,255,0.75); cursor: default; transition: background 0.2s; display: flex; align-items: center; gap: 8px; }
  .menu-item:hover { color: #fff; }
  .menu-item.active { color: #fff; font-weight: 500; }
  .menu-item .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; }
  .main { flex: 1; display: flex; flex-direction: column; }
  .header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid; }
  .header-left { font-size: 14px; color: #999; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-right .btn { padding: 4px 12px; border-radius: 6px; font-size: 13px; cursor: default; }
  .content { flex: 1; background: #FFFEF9; padding: 20px; }
  .content-card { background: #fff; border-radius: 8px; padding: 16px; border: 1px solid #EDE8DC; height: 100%; }
  .content-card .placeholder { color: #ccc; font-size: 13px; text-align: center; padding-top: 60px; }

  /* Sidebar themes */
  .sidebar-mogreen { background: #1A2E1A; }
  .sidebar-mogreen .sidebar-title { color: #95DE64; }
  .sidebar-mogreen .menu-item.active { background: rgba(82,196,26,0.2); }
  .sidebar-mogreen .menu-item:hover { background: rgba(149,222,100,0.15); }

  .sidebar-warmgray { background: #1F2937; }
  .sidebar-warmgray .sidebar-title { color: #D4B896; }
  .sidebar-warmgray .menu-item.active { background: rgba(212,184,150,0.2); }
  .sidebar-warmgray .menu-item:hover { background: rgba(212,184,150,0.12); }

  .sidebar-navy { background: #0F1B2D; }
  .sidebar-navy .sidebar-title { color: #7EC8E3; }
  .sidebar-navy .menu-item.active { background: rgba(126,200,227,0.2); }
  .sidebar-navy .menu-item:hover { background: rgba(126,200,227,0.12); }

  /* Tabs for switching sidebar */
  .sidebar-tabs { display: flex; gap: 6px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #eee; }
  .sidebar-tabs .tab { padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid #ddd; background: #fafafa; color: #666; transition: all 0.2s; }
  .sidebar-tabs .tab.active { background: #52C41A; color: #fff; border-color: #52C41A; }
</style>
</head>
<body>

<h1>Header 配色方案对比</h1>

<div id="app"></div>

<script>
const sidebarThemes = {
  mogreen: { key: 'mogreen', label: '墨绿', cls: 'sidebar-mogreen', titleColor: '#95DE64' },
  warmgray: { key: 'warmgray', label: '暖灰蓝', cls: 'sidebar-warmgray', titleColor: '#D4B896' },
  navy: { key: 'navy', label: '藏青', cls: 'sidebar-navy', titleColor: '#7EC8E3' },
};

const headerSchemes = [
  {
    id: 'A',
    name: '暖米白渐变（当前）',
    tag: '当前',
    tagColor: '#52C41A',
    bg: 'linear-gradient(90deg, #FAFAF5, #F5EFE6)',
    borderColor: '#EDE8DC',
    textColor: '#5C4A32',
    btnBg: 'transparent',
    btnColor: '#5C4A32',
  },
  {
    id: 'B',
    name: '纯白简约',
    tag: '极简',
    tagColor: '#1677FF',
    bg: '#FFFFFF',
    borderColor: '#f0f0f0',
    textColor: '#666',
    btnBg: 'transparent',
    btnColor: '#333',
  },
  {
    id: 'C',
    name: '浅灰蓝',
    tag: '商务',
    tagColor: '#722ED1',
    bg: 'linear-gradient(90deg, #F0F2F5, #E8ECF1)',
    borderColor: '#d9d9d9',
    textColor: '#555',
    btnBg: 'transparent',
    btnColor: '#333',
  },
  {
    id: 'D',
    name: '侧边栏同色系（极浅）',
    tag: '跟随',
    tagColor: '#FA8C16',
    dynamic: true,
    borderColor: '#e0e0e0',
    textColor: '#444',
    btnBg: 'transparent',
    btnColor: '#333',
    // will compute bg per sidebar
    bgMap: {
      mogreen: 'linear-gradient(90deg, rgba(26,46,26,0.06), rgba(26,46,26,0.02))',
      warmgray: 'linear-gradient(90deg, rgba(31,41,55,0.06), rgba(31,41,55,0.02))',
      navy: 'linear-gradient(90deg, rgba(15,27,45,0.06), rgba(15,27,45,0.02))',
    },
    borderMap: {
      mogreen: 'rgba(26,46,26,0.12)',
      warmgray: 'rgba(31,41,55,0.12)',
      navy: 'rgba(15,27,45,0.12)',
    },
  },
  {
    id: 'E',
    name: '侧边栏深色延伸',
    tag: '沉浸',
    tagColor: '#333',
    dynamic: true,
    textColor: 'rgba(255,255,255,0.85)',
    btnBg: 'rgba(255,255,255,0.1)',
    btnColor: 'rgba(255,255,255,0.85)',
    bgMap: {
      mogreen: 'linear-gradient(90deg, #1A2E1A, #2a4a2a)',
      warmgray: 'linear-gradient(90deg, #1F2937, #374151)',
      navy: 'linear-gradient(90deg, #0F1B2D, #1a2d47)',
    },
    borderMap: {
      mogreen: 'rgba(149,222,100,0.15)',
      warmgray: 'rgba(212,184,150,0.15)',
      navy: 'rgba(126,200,227,0.15)',
    },
  },
];

let currentSidebar = 'mogreen';

function render() {
  const app = document.getElementById('app');
  const sb = sidebarThemes[currentSidebar];

  let html = '';

  // Sidebar tabs
  html += '<div class="sidebar-tabs">';
  html += '<span style="font-size:12px;color:#999;line-height:28px;">侧边栏主题：</span>';
  for (const t of Object.values(sidebarThemes)) {
    html += `<div class="tab ${t.key === currentSidebar ? 'active' : ''}" onclick="switchSidebar('${t.key}')">${t.label}</div>`;
  }
  html += '</div>';

  for (const h of headerSchemes) {
    const headerBg = h.dynamic ? h.bgMap[currentSidebar] : h.bg;
    const borderColor = h.dynamic ? (h.borderMap?.[currentSidebar] || h.borderColor) : h.borderColor;

    html += `<div class="scheme">`;
    html += `<div class="scheme-label">方案 ${h.id}: ${h.name} <span class="tag" style="background:${h.tagColor}">${h.tag}</span></div>`;
    html += `<div class="preview">`;

    // Sidebar
    html += `<div class="sidebar ${sb.cls}">`;
    html += `<div class="sidebar-title">门诊管理系统</div>`;
    html += `<div class="menu-item active"><span class="dot"></span>患者管理</div>`;
    html += `<div class="menu-item"><span class="dot"></span>病历列表</div>`;
    html += `<div class="menu-item"><span class="dot"></span>中医药</div>`;
    html += `<div class="menu-item"><span class="dot"></span>运营</div>`;
    html += `<div class="menu-item"><span class="dot"></span>系统设置</div>`;
    html += `</div>`;

    // Main area
    html += `<div class="main">`;
    html += `<div class="header" style="background:${headerBg};border-color:${borderColor}">`;
    html += `<div class="header-left" style="color:${h.textColor}">☰</div>`;
    html += `<div class="header-right">`;
    html += `<span class="btn" style="color:${h.btnColor}">🎨</span>`;
    html += `<span class="btn" style="color:${h.btnColor}">👤 管理员</span>`;
    html += `</div>`;
    html += `</div>`;
    html += `<div class="content"><div class="content-card"><div class="placeholder">页面内容区域</div></div></div>`;
    html += `</div>`;

    html += `</div></div>`;
  }

  app.innerHTML = html;
}

function switchSidebar(key) {
  currentSidebar = key;
  render();
}

render();
</script>
</body>
</html>
